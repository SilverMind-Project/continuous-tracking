syntax = "proto3";

package continuoustracking.v1;

option go_package = "github.com/SilverMind-Project/continuous-tracking/proto/continuoustracking/v1";

// TrackingEvent is the core message produced by the tracking-orchestrator
// after processing a frame. It carries the Bayesian identity posterior,
// spatial coordinates, and temporal metadata.
message TrackingEvent {
  // Identity of the camera stream (matches RTSP ingress config).
  string camera_id = 1;

  // Wall-clock time when the event was committed (not when frame arrived).
  // Used as the authoritative timestamp for ordering.
  fixed64 event_time_unix_ns = 2;

  // Frame-level metadata.
  FrameRef frame_ref = 3;

  // One entry per detected person in the frame.
  repeated Detection detections = 4;

  // Identity resolution: for each PH that was matched to a known
  // person, the posterior probability distribution over candidates.
  // DEPRECATED: prefer identity_snapshots (field 8).  This field is kept
  // for one compatibility release and will stop being populated afterward.
  repeated IdentityRevision identity_revisions = 5 [deprecated = true];

  // Resolved room name for the camera at event time. Empty when the camera
  // has no room mapping configured. The CC LocationWriter uses this to
  // open / close PersonLocationHistory rows on room transitions.
  string room_name = 6;

  // Unique event identifier for tracing / audit. UUID4.
  string event_id = 7;

  // Identity snapshots: lightweight per-global-track identity state for
  // live display.  Replaces the dual-purpose identity_revisions field (5)
  // which conflated per-frame snapshots with standalone revision messages.
  repeated IdentitySnapshot identity_snapshots = 8;
}

// FrameRef points to a frame stored in MinIO without duplicating pixel data.
message FrameRef {
  // MinIO object key for the original frame.
  string minio_key = 1;

  // Frame resolution.
  int32 width = 2;
  int32 height = 3;

  // Frame index within the camera stream (monotonically increasing).
  int64 frame_index = 4;

  // Capture time from the RTSP source (pre-NTP correction).
  fixed64 capture_time_unix_ns = 5;
}

// Detection represents one person detected in a single frame.
message Detection {
  // Unique per-frame identifier for this detection bounding box.
  string detection_id = 1;

  // Bounding box in pixel coordinates (top-left origin).
  BoundingBox bbox = 2;

  // Embedding vector from the ReID model (L2-normalized, float32).
  // The canonical production model is SOLIDER-REID with 768 dimensions.
  repeated float embedding = 3;

  // Confidence score from the detection model (0.0 to 1.0).
  float confidence = 4;

  reserved 5, 6;
  reserved "tracklet_id", "global_track_id";

  // Floor point in the shared floor-plan coordinate system (millimetres).
  // {x_mm=0, y_mm=0, calibrated=false} when the source camera lacks a
  // homography or the projection is degenerate.
  FloorPoint floor_point = 7;

  // RTMPose 17 COCO keypoints (normalised to [0,1] within the bbox crop).
  // Empty when pose estimation is disabled or the crop is too small.
  repeated PoseKeypoint pose_keypoints = 9;

  // Last 12 foot-point positions for this tracklet (camera-frame normalised
  // coords [0,1]). Oldest entry first. Empty until the tracklet has history.
  repeated TrailPoint trail = 10;

  // Posterior evidence snapshot from the identity resolver.
  PosteriorEvidence evidence = 11;

  // Floor position in the shared floor-plan frame, in metres.
  // Both are 0.0 when the source camera is not calibrated.
  float floor_x = 12;
  float floor_y = 13;

  // Classified posture: standing | sitting | walking | lying | unknown.
  string posture = 14;

  // Person Hypothesis ID assigned by the world-coordinate tracker.
  string ph_id = 15;
}

// PoseKeypoint is one of the 17 COCO body keypoints.
message PoseKeypoint {
  float x = 1;      // horizontal position normalised to bbox crop [0, 1]
  float y = 2;      // vertical position normalised to bbox crop [0, 1]
  float score = 3;  // visibility confidence [0, 1]
}

// TrailPoint is a historical foot-point position in camera-frame coords.
message TrailPoint {
  float x = 1;  // normalised horizontal [0, 1]
  float y = 2;  // normalised vertical [0, 1]
}

// PosteriorEvidence captures the identity resolver's confidence snapshot.
message PosteriorEvidence {
  float top_prob         = 1;  // P(top identity | observations)
  float top2_prob        = 2;  // P(second-best identity | observations)
  bool  face_anchor_used = 3;  // true when a face anchor drove the commit
}

// BoundingBox in pixel coordinates: top-left origin, width/height positive.
message BoundingBox {
  int32 x_min = 1;
  int32 y_min = 2;
  int32 x_max = 3;
  int32 y_max = 4;
}

// FloorPoint is a 2D point in the shared floor-plan coordinate system, in
// millimetres.  When calibrated=true the coordinates are consistent across
// all cameras that share the same floor_plan_id.  When calibrated=false
// both coordinates are zero and must not be used for metric comparisons.
message FloorPoint {
  // X coordinate in the shared floor-plan frame, in mm.
  int64 x_mm = 1;
  // Y coordinate in the shared floor-plan frame, in mm.
  int64 y_mm = 2;
  // Whether the homography was calibrated for the source camera.
  bool calibrated = 3;
}

// IdentityRevision is published to the tracking.revisions Redis Stream
// when an identity assignment for a Person Hypothesis changes.
// N0: renamed global_track_id -> ph_id; tracklet_ids reserved.
message IdentityRevision {
  // The Person Hypothesis whose identity is being revised.
  string ph_id = 1;

  // Probability distribution over candidate identities.
  // N0: unused by the PH-native revision; kept for wire compatibility.
  repeated IdentityCandidate candidates = 2;

  // The MAP (maximum a posteriori) estimate.
  // N0: unused; kept for wire compatibility.
  string map_identity_id = 3;

  // Entropy of the posterior (measure of uncertainty, in bits).
  // Lower = more certain.
  // N0: unused at this field; posterior_entropy moved into evidence_json.
  float posterior_entropy = 4;

  // When this revision was computed.
  fixed64 revision_time_unix_ns = 5;

  // -- stream-message-only fields --

  // Unique ID of this revision. Used for idempotent CC-side rewrites.
  string revision_id = 6;

  // N0: tracklet_ids removed.  Reserved to prevent accidental reuse.
  reserved 7;

  // Identity before the revision (empty when promoting from UNKNOWN).
  string previous_identity_id = 8;

  // Identity after the revision (empty when demoting to UNKNOWN).
  string new_identity_id = 9;

  // Human-readable reason: initial_assignment | identity_change |
  // demoted_to_unknown | manual_override | merge.
  string reason = 10;

  // N0: evidence_json extended with actor, rewritten_rows, observation_count,
  // and evidence_sources in addition to the legacy posterior fields.
  string evidence_json = 11;

  // Explicit inferred identity from the resolver.
  string inferred_identity_id = 12;

  // Effective identity after applying overrides and authority rules.
  string effective_identity_id = 13;

  // Authority level (e.g. "face", "reid", "operator").
  string authority = 14;

  // Component or user that produced the decision.
  string decision_source = 15;

  // The durable UUID for this specific decision.
  string decision_id = 16;

  // Description of any conflict (e.g. duplicate active identity).
  string conflict = 17;

  // -- M06 segment-correction / revision-range / projection fields --
  // These are typed proto fields (NOT folded into evidence_json). Older readers
  // ignore unknown fields and keep working per the M04 compatibility rules.

  // Operator/inferred revision kind: operator_correction | operator_unknown |
  // operator_frame_correction | operator_handoff | operator_compensation |
  // inferred. Empty for legacy automatic revisions.
  string revision_kind = 18;

  // Effective range this revision applies to (operator authority is bounded to
  // these observation timestamps). Zero when the revision is not range-scoped.
  fixed64 range_start_unix_ns = 19;
  fixed64 range_end_unix_ns = 20;

  // Authority of the effective range: "operator" or "inferred".
  string range_authority = 21;

  // Stable IDs for the revision-range projection model.
  string revision_range_id = 22;
  string correction_id = 23;

  // Projections that must acknowledge this revision_id before the correction
  // job is complete (e.g. "cts_internal", "cc").
  repeated string required_projections = 24;

  // Schema version of the revision-range payload for forward compatibility.
  string revision_schema_version = 25;
}

// IdentitySnapshot is a lightweight per-PH identity state for live
// display.  Unlike IdentityRevision, it is not a standalone stream message —
// it only appears as a sub-message of TrackingEvent.
message IdentitySnapshot {
  // R3: canonical field name.  Field number 1 is unchanged; binary wire is
  // compatible.  The old name "global_track_id" is reserved to prevent
  // accidental JSON/text-format reuse.
  string ph_id = 1;
  reserved "global_track_id";

  // The committed identity for this global track (empty when UNKNOWN).
  string identity_id = 2;

  // Probability of the top identity from the posterior.
  float top_probability = 3;

  // Probability of the second-best identity from the posterior.
  float second_probability = 4;

  // Entropy of the full posterior (bits). Lower = more certain.
  float posterior_entropy = 5;

  // Whether direct face evidence (ArcFace) contributed to this decision.
  bool direct_face_evidence = 6;

  // Evidence source summary serialised as JSON:
  // {"sources": {"direct_face": 1, "reid": 3}, "direct_face_confidence": 0.95, ...}
  string evidence_json = 7;

  // Exponential moving average of crop-quality scores for this PH (U1/U2).
  // Range [0, 1]; 0.0 means no quality data yet.  Consumed by CC to populate
  // PersonLocationEnvelope.quality without client-side inference (design rule D5).
  float mean_quality = 8;

  // Explicit inferred identity from the resolver.
  string inferred_identity_id = 9;

  // Effective identity after applying overrides and authority rules.
  string effective_identity_id = 10;

  // Authority level (e.g. "face", "reid", "operator").
  string authority = 11;

  // Component or user that produced the decision.
  string decision_source = 12;

  // The durable UUID for this specific decision.
  string decision_id = 13;

  // Description of any conflict.
  string conflict = 14;

  // Timestamp of the last independent authoritative evidence.
  fixed64 last_independent_evidence_at_unix_ns = 15;

  // Hash of the configuration used for the resolver.
  string config_hash = 16;

  // Version of the model set used for ReID/Face/etc.
  string model_set_version = 17;
}

// IdentityCandidate is one candidate identity with its posterior probability.
message IdentityCandidate {
  // The identity's gallery entry ID.
  string identity_id = 1;

  // Display name for the identity.
  string display_name = 2;

  // Posterior probability P(identity | observations).
  float probability = 3;
}

// PresenceEvent is published to tracking.presence when a person appears in
// or disappears from the home.  One event per state transition; never
// emitted per frame.
message PresenceEvent {
  // Person Hypothesis ID of the person whose presence changed.
  string ph_id = 1;

  // Committed identity ID (empty when the PH is still UNKNOWN).
  string identity_id = 2;

  // Whether the person appeared or disappeared.
  PresenceEventType event_type = 3;

  // Room where the event occurred (camera-bound room at the time).
  string room_name = 4;

  // Wall-clock time of the state change.
  fixed64 event_time_unix_ns = 5;
}

enum PresenceEventType {
  PRESENCE_EVENT_TYPE_UNSPECIFIED = 0;
  PRESENCE_EVENT_TYPE_APPEARED = 1;
  PRESENCE_EVENT_TYPE_DISAPPEARED = 2;
}

// DwellEvent is published to tracking.dwell when a dwell segment starts
// or ends (person enters or leaves a room).  One event per threshold
// crossing; never emitted per frame.
message DwellEvent {
  // Person Hypothesis ID.
  string ph_id = 1;

  // Committed identity ID (empty when UNKNOWN).
  string identity_id = 2;

  // Whether the dwell started or ended.
  DwellEventType event_type = 3;

  // Room name of the dwell segment.
  string room_name = 4;

  // Wall-clock time of the state change.
  fixed64 event_time_unix_ns = 5;

  // Duration in seconds (populated only on ended events).
  int32 duration_s = 6;
}

enum DwellEventType {
  DWELL_EVENT_TYPE_UNSPECIFIED = 0;
  DWELL_EVENT_TYPE_STARTED = 1;
  DWELL_EVENT_TYPE_ENDED = 2;
}

// Indicates whether a SceneSample frames an isolated person,
// a crowd, an interaction, or an empty scene.
enum SceneSampleKind {
  SCENE_SAMPLE_KIND_UNSPECIFIED = 0;
  SCENE_SAMPLE_KIND_ISOLATED_PERSON = 1;
  SCENE_SAMPLE_KIND_INTERACTION = 2;
  SCENE_SAMPLE_KIND_CROWD = 3;
  SCENE_SAMPLE_KIND_EMPTY = 4;
}

// CCIdentityAssertion represents an identity assertion generated by Cognitive Companion.
// This replaces the old legacy text-based payload on the cc.identity_assertions stream.
message CCIdentityAssertion {
  // The identity assigned by CC.
  string person_id = 1;

  // The camera from which this assertion originates.
  string camera_id = 2;

  // When the frame was captured.
  fixed64 captured_at_unix_ns = 3;

  // Estimated physical floor position (X) in meters.
  float floor_x_m = 4;

  // Estimated physical floor position (Y) in meters.
  float floor_y_m = 5;

  // Raw cosine similarity from the face ID service.
  float raw_similarity = 6;

  // Calibrated confidence, if calibration is enabled.
  optional float calibrated_confidence = 7;

  // Status of the calibration ("calibrated", "uncalibrated", "extrapolated").
  string calibration_status = 8;

  // The component that generated this assertion (e.g., "cc-arcface").
  string source = 9;

  // Which model version was used.
  string model_version = 10;

  // Which preprocessing version was used.
  string preprocessing_version = 11;
}
