syntax = "proto3";

package continuoustracking.v1;

option go_package = "github.com/khoofia/continuous-tracking/proto/continuoustracking/v1";

// FrameReady is published to Redis Streams by the rtsp-ingress Go service
// when a new frame is available for processing. The tracking-orchestrator
// consumes this from the frame-pipeline stream.
message FrameReady {
  // Which camera stream this frame belongs to.
  string camera_id = 1;

  // MinIO key where the frame JPEG/PNG is stored.
  string minio_key = 2;

  // Frame index (monotonically increasing per camera).
  int64 frame_index = 3;

  // Capture timestamp from RTSP source (nanoseconds since Unix epoch).
  fixed64 capture_time_unix_ns = 4;

  // Wall-clock time when ingress received the frame (nanoseconds).
  fixed64 received_time_unix_ns = 5;

  // Frame dimensions.
  int32 width = 6;
  int32 height = 7;

  // Frame rate at which this frame was extracted (0 = all frames).
  float sample_fps = 8;
}

// FrameResponse is published back to Redis Streams by the
// tracking-orchestrator after processing. The rtsp-ingress may use this
// for acknowledgment and metrics.
message FrameResponse {
  // Correlates to the FrameReady frame_index + camera_id.
  string camera_id = 1;
  int64 frame_index = 2;

  // Whether processing succeeded.
  bool success = 3;

  // If not success, a brief error code.
  string error_code = 4;

  // Processing latency in microseconds.
  int64 processing_latency_us = 5;

  // Number of detections produced.
  int32 detection_count = 6;

  // Wall-clock time when processing completed.
  fixed64 completed_time_unix_ns = 7;
}
