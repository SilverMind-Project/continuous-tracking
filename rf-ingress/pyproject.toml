[project]
name = "rf-ingress"
version = "0.1.0"
description = "Continuous Tracking System - hardware-neutral RF localization ingress service"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.3.0",
    "cts-contracts>=0.5.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "prometheus-client>=0.25.0",
    "protobuf>=5.29.0,<7",
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
    "redis[hiredis]>=5.2.0",
    "scipy>=1.14.0",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.35.1",
    "hypothesis>=6.100.0",
    "import-linter>=2.0.0,<2.12",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "testcontainers[redis]>=4.9.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rf_ingress*"]

[tool.setuptools.package-data]
rf_ingress = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["rf_ingress/proto", "tests/fixtures/lint_canary"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "I002", "N", "W", "UP", "B", "BLE", "A", "C4", "SIM", "RUF", "FA",
    "DTZ", "ASYNC", "PGH", "G", "S608", "TID", "ERA",
]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["TID252"]  # package re-export blocks may use relative imports

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["rf_ingress/proto/"]

[[tool.mypy.overrides]]
module = [
    "google.protobuf.*",
    "scipy",
    "scipy.optimize",
    "scipy.stats",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rf_ingress.proto.*"]
ignore_errors = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "fixture-scope"
testpaths = ["tests"]
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "integration: integration tests requiring Docker testcontainers (skipped by default)",
]

[tool.importlinter]
root_package = "rf_ingress"

[[tool.importlinter.contracts]]
name = "Adapters must not import publish, pipeline, health, or main"
type = "forbidden"
source_modules = ["rf_ingress.adapters"]
forbidden_modules = [
    "rf_ingress.publish",
    "rf_ingress.position_tracks",
    "rf_ingress.pipeline",
    "rf_ingress.health",
    "rf_ingress.main",
]

[[tool.importlinter.contracts]]
name = "Solver must remain pure geometry/math over domain"
type = "forbidden"
source_modules = ["rf_ingress.solver"]
forbidden_modules = [
    "rf_ingress.adapters",
    "rf_ingress.publish",
    "rf_ingress.position_tracks",
    "rf_ingress.site_config",
    "rf_ingress.pipeline",
    "rf_ingress.health",
    "rf_ingress.main",
]

[[tool.importlinter.contracts]]
name = "Domain has no internal rf_ingress dependencies"
type = "forbidden"
source_modules = ["rf_ingress.domain"]
forbidden_modules = [
    "rf_ingress.adapters",
    "rf_ingress.clock",
    "rf_ingress.config",
    "rf_ingress.health",
    "rf_ingress.main",
    "rf_ingress.observability",
    "rf_ingress.pipeline",
    "rf_ingress.position_tracks",
    "rf_ingress.publish",
    "rf_ingress.registration",
    "rf_ingress.replay",
    "rf_ingress.site_config",
    "rf_ingress.solver",
]

[[tool.importlinter.contracts]]
name = "Core pipeline and solver never import concrete adapters directly"
type = "forbidden"
source_modules = [
    "rf_ingress.pipeline",
    "rf_ingress.position_tracks",
    "rf_ingress.publish",
    "rf_ingress.registration",
    "rf_ingress.site_config",
    "rf_ingress.solver",
]
forbidden_modules = [
    "rf_ingress.adapters.anchor_ranging_mqtt",
    "rf_ingress.adapters.ble_motion",
    "rf_ingress.adapters.ble_scanner_mqtt",
    "rf_ingress.adapters.device_ranging_mqtt",
    "rf_ingress.adapters.position_track_mqtt",
    "rf_ingress.adapters.simulator",
]

[tool.uv.sources]
cts-contracts = { git = "https://github.com/SilverMind-Project/cts-contracts" }
