# Continuous Tracking System — local development environment
# Services: Redis, tracking-orchestrator, rtsp-ingress
#
# MinIO is provided externally (minio.nanai.khoofia.com).
# PostgreSQL is provided by the shared ../docker-compose.db.yml (included below).

include:
  - path: ../db/docker-compose.db.yml
    env_file:
      - ../db/.env

services:
  # -----------------------------------------------------------------------
  # Redis (Streams transport)
  # -----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cts-redis
    networks:
      - nanai
    ports:
      - "6379:6379"
    command: redis-server --bind 0.0.0.0 --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -----------------------------------------------------------------------
  # Triton Inference Server (GPU model serving)
  # Reserved for M3+. Kept behind an explicit profile so normal local
  # development does not try to start a noisy placeholder.
  # -----------------------------------------------------------------------
  triton:
    image: nvcr.io/nvidia/tritonserver:24.04-py3
    container_name: cts-triton
    networks:
      nanai:
        aliases:
          - triton
    command: >
      tritonserver
      --model-repository=/models
      --grpc-port=8701
      --http-port=8700
      --metrics-port=8702
      --exit-on-error=false
      --strict-model-config=false
    ports:
      - "8700:8700"
      - "8701:8701"
      - "8702:8702"
    volumes:
      - ./triton-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "tritonserver", "model-server", "models", "--name", "nonexistent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - gpu

  # -----------------------------------------------------------------------
  # Tracking Orchestrator (Python — ML pipeline)
  # -----------------------------------------------------------------------
  tracking-orchestrator:
    build:
      context: ..
      dockerfile: continuous-tracking/tracking-orchestrator/Dockerfile
    container_name: cts-orchestrator
    networks:
      - nanai
    environment:
      DATABASE_URL: postgresql+asyncpg://${CTS_DB_USER:-cts_user}:${CTS_DB_PASSWORD:?err}@postgres:5432/continuous_tracking
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: "false"
      TRITON_ENDPOINT: triton:8701
      CTS_ENABLED: "true"
    ports:
      - "8500:8500"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - app

  # -----------------------------------------------------------------------
  # go2rtc (RTSP proxy sidecar for rtsp-ingress)
  # Manages all RTSP sessions and exposes JPEG frames via HTTP API.
  # rtsp-ingress reaches this service at http://go2rtc:1984.
  # -----------------------------------------------------------------------
  go2rtc:
    image: ghcr.io/alexxit/go2rtc:1.9.14
    container_name: cts-go2rtc
    networks:
      - nanai
    environment:
      # Disable auto-discovery features not needed in this setup.
      GO2RTC_CONF: /config/go2rtc.yaml
    volumes:
      - ./rtsp-ingress/config/go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      - "1984:1984"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1984/api"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - app

  # -----------------------------------------------------------------------
  # RTSP Ingress (Go — polls go2rtc for JPEG frames)
  # -----------------------------------------------------------------------
  rtsp-ingress:
    build:
      context: .
      dockerfile: rtsp-ingress/Dockerfile
    container_name: cts-rtsp-ingress
    networks:
      - nanai
    environment:
      REDIS_ADDRESS: redis:6379
      REDIS_DB: "0"
      REDIS_STREAM: frames.ready
      REDIS_MAXLEN_APPROX: "100000"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: ${MINIO_BUCKET}
      GO2RTC_ADDR: http://go2rtc:1984
      CAMERAS_JSON: "[]"
      COGNITIVE_BASE_URL: http://cc-backend:8000
      COGNITIVE_API_KEY: ${CC_INGRESS_API_KEY:?err}
    ports:
      - "8090:8090"
    depends_on:
      redis:
        condition: service_healthy
      go2rtc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - app

volumes:
  redisdata:

networks:
  nanai:
    name: nanai
    external: true
