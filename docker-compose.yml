# Continuous Tracking System — local development environment
# Services: Redis, tracking-orchestrator, rtsp-ingress
#
# Prerequisites (start these first):
#   - Shared PostgreSQL:  cd ../db && docker compose up -d
#
# MinIO is provided externally (minio.nanai.khoofia.com).
# The shared PostgreSQL instance must be started independently to avoid
# container-name conflicts.

services:
  # -----------------------------------------------------------------------
  # Redis (Streams transport)
  # -----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cts-redis
    networks:
      - nanai
    ports:
      - "6379:6379"
    command: redis-server --bind 0.0.0.0 --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -----------------------------------------------------------------------
  # Triton Inference Server (GPU model serving)
  # Reserved for M3+. Kept behind an explicit profile so normal local
  # development does not try to start a noisy placeholder.
  # -----------------------------------------------------------------------
  triton:
    build:
      context: ./triton-models
      dockerfile: Dockerfile
    image: cts-triton:26.04-py3
    container_name: cts-triton
    networks:
      nanai:
        aliases:
          - triton
    environment:
      HF_TOKEN: ${HF_TOKEN:?err}
    command: >
      tritonserver
      --model-repository=/models
      --grpc-port=8701
      --http-port=8700
      --metrics-port=8702
      --exit-on-error=false
      --cuda-memory-pool-byte-size=0:2147483648
    ports:
      - "8700:8700"
      - "8701:8701"
      - "8702:8702"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./triton-models/person-detector:/models/person-detector
      - ./triton-models/clip-vision:/models/clip-vision
      - ./triton-models/florence-2:/models/florence-2
      - ./triton-models/florence-2-vision:/models/florence-2-vision
      - ./triton-models/florence-2-embed:/models/florence-2-embed
      - ./triton-models/florence-2-encoder:/models/florence-2-encoder
      - ./triton-models/florence-2-decoder:/models/florence-2-decoder
      - ./triton-models/reid-solider:/models/reid-solider
      - ./triton-models/pose-rtmpose:/models/pose-rtmpose
      - ./triton-models/face-detector-scrfd:/models/face-detector-scrfd
      - ./triton-models/face-recognition-arcface:/models/face-recognition-arcface
      - ./triton-models/face-landmark-2d106:/models/face-landmark-2d106
      - ./triton-models/face-landmark-3d68:/models/face-landmark-3d68
      - ./triton-models/face-attribute-genderage:/models/face-attribute-genderage
      - ./triton-models/embeddinggemma-300m:/models/embeddinggemma-300m
      - ./triton-models/depth-anything-v2:/models/depth-anything-v2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8700/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # -----------------------------------------------------------------------
  # Tracking Orchestrator (Python — ML pipeline)
  # -----------------------------------------------------------------------
  tracking-orchestrator:
    env_file:
     - .env
    build:
      context: ..
      dockerfile: continuous-tracking/tracking-orchestrator/Dockerfile
    container_name: cts-orchestrator
    networks:
      - nanai
    environment:
      DATABASE_URL: postgresql+asyncpg://${CTS_DB_USER:?err}:${CTS_DB_PASSWORD:?err}@postgres:5432/continuous_tracking
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:?err}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?err}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?err}
      MINIO_BUCKET: ${MINIO_BUCKET:?err}
      MINIO_USE_SSL: "false"
      TRITON_GRPC_URL: triton:8701
      PERSON_ID_SERVICE_URL: http://person-id:8200
      CC_API_URL: http://cc-backend:8000
      CC_INGRESS_API_KEY: ${CC_INGRESS_API_KEY:?err}
      CTS_ENABLED: "true"
      LOG_LEVEL: "DEBUG"
    ports:
      - "8500:8500"
    depends_on:
      redis:
        condition: service_healthy
      triton:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------------
  # go2rtc (RTSP proxy sidecar for rtsp-ingress)
  # Manages all RTSP sessions and exposes JPEG frames via HTTP API.
  # rtsp-ingress reaches this service at http://go2rtc:1984.
  # -----------------------------------------------------------------------
  go2rtc:
    image: ghcr.io/alexxit/go2rtc:1.9.14
    container_name: cts-go2rtc
    networks:
      - nanai
    environment:
      # Disable auto-discovery features not needed in this setup.
      GO2RTC_CONF: /config/go2rtc.yaml
    # go2rtc persists dynamic stream registrations (PUT /api/streams) back to
    # GO2RTC_CONF, so /config must be writable. The repo file is bind-mounted
    # read-only at /seed and copied into the named volume on first start
    # (cp -n preserves dynamic registrations across restarts; wipe the
    # go2rtc-config volume to pick up edits to the seed file).
    entrypoint:
      - /bin/sh
      - -c
      - 'cp -n /seed/go2rtc.yaml /config/go2rtc.yaml && exec /usr/local/bin/go2rtc -config /config/go2rtc.yaml'
    volumes:
      - ./rtsp-ingress/config/go2rtc.yaml:/seed/go2rtc.yaml:ro
      - go2rtc-config:/config
    ports:
      - "1984:1984"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1984/api"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------------
  # RTSP Ingress (Go — polls go2rtc for JPEG frames)
  # -----------------------------------------------------------------------
  rtsp-ingress:
    build:
      context: .
      dockerfile: rtsp-ingress/Dockerfile
    container_name: cts-rtsp-ingress
    networks:
      - nanai
    environment:
      REDIS_ADDRESS: redis:6379
      REDIS_DB: "0"
      REDIS_STREAM: frames.ready
      REDIS_MAXLEN_APPROX: "100000"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?err}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?err}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?err}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: ${MINIO_BUCKET:?err}
      GO2RTC_ADDR: http://go2rtc:1984
      CAMERAS_JSON: "[]"
      COGNITIVE_BASE_URL: http://cc-backend:8000
      COGNITIVE_API_KEY: ${CC_INGRESS_API_KEY:?err}
    ports:
      - "8090:8090"
    depends_on:
      redis:
        condition: service_healthy
      go2rtc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hf-cache:
  redisdata:
  go2rtc-config:

networks:
  nanai:
    name: nanai
    external: true
