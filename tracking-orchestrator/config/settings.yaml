# Tracking Orchestrator — settings
# Deployment-only values are interpolated with ${VAR}. Runtime tunables are
# literal values in this file to avoid hidden env-var override surfaces.
# Settings blocks are grouped by operator tunables first, advanced or reserved
# constants second. The loader reads every key explicitly in app/main.py.

# Deployment timezone — must match cognitive-companion's app.timezone so that
# time-of-day signals (sundowning, nighttime movement) are computed in local
# time rather than UTC.  IANA tz database name, e.g. "America/New_York".
app:
  timezone: America/New_York

# Redis Streams transport
redis:
  url: "${REDIS_URL}"
  consumer_group: cts-orchestrator
  consumer_name: orchestrator-1
  frames_stream: frames.ready
  events_stream: tracking.events
  revisions_stream: tracking.revisions
  signals_stream: tracking.signals
  scene_samples_stream: scene.samples
  presence_stream: tracking.presence
  dwell_stream: tracking.dwell
  batch_max_wait_ms: 100
  batch_max_size: 8
  xack_timeout_ms: 5000
  ack_ttl_seconds: 300

# PostgreSQL database
database:
  url: "${DATABASE_URL}"

# Triton Inference Server
triton:
  url: "${TRITON_GRPC_URL}"
  person_detector_model: person-detector
  detector_static_batch_size: 8
  # Enable dynamic-batch detector (person-detector-dynamic). False = static
  # batch-8 (default, Jetson-compatible). Set person_detector_model to
  # person-detector-dynamic when enabling this flag.
  detector_dynamic_batch: false
  reid_model: reid-solider
  pose_model: pose-rtmpose
  pose_enabled: true
  # Model address used only when pipeline.posture.depth_slow_path_enabled is true.
  depth_model: depth-anything-v2
  timeout_ms: 5000
  startup_wait_s: 120
  startup_retry_interval_s: 5

# MinIO / S3-compatible object storage
minio:
  endpoint: "${MINIO_ENDPOINT_URL}"
  bucket: "${MINIO_BUCKET}"
  access_key: "${MINIO_ACCESS_KEY}"
  secret_key: "${MINIO_SECRET_KEY}"
  region: us-east-1
  secure: false

# Face identification via person-identification-service (ArcFace)
# Per-camera overrides (enabled/disabled, min_confidence) are fetched from
# cognitive-companion at startup.
face_id:
  url: "${PERSON_ID_SERVICE_URL}"
  cooldown_s: 5.0
  timeout_s: 2.0
  # Face-ID emission gate: service matches below this confidence are dropped
  # before becoming face anchors. Resolver face_commit_min_confidence is the
  # stricter identity-lock gate after an anchor exists.
  min_confidence: 0.6
  enabled: true
  # M10: expected calibration versions. calibrated_confidence is set to None
  # when the person-id response carries a different model or preprocessing version,
  # ensuring the authority gate fails closed on model mismatches.
  expected_arcface_model_version: "buffalo_l"
  expected_preprocessing_version: "v1"

# Dementia signal computation
#
# Threshold rationale (all values are evidence-based):
#
# stillness_threshold_minutes (60):
#   Clinically meaningful seated immobility in dementia occurs after ~60 min, not 30.
#   Desk work, reading, and TV watching routinely exceed 30 min without clinical concern.
#   Reference: Alzheimer's Association caregiver guidelines; NICE NG97.
#
# stillness_motion_floor (0.05):
#   Unit: mean keypoint displacement in normalized units per second (nu/s) -- absolute
#   pixel displacement / bbox_diagonal_px / dt. Still persons produce ~0.02-0.04 nu/s
#   (breathing + micro-adjustments ~2-3 px/frame at 5 fps, 340 px bbox_diag).
#   Floor is set at the p95 of still segments (0.05 nu/s). Provisional: recalibrate
#   after 1 week of live data using scripts/calibrate_motion_energy.py.
#
# pacing_room_threshold (8):
#   Purpose-driven ambulation (kitchen→living room→bathroom) routinely produces 5-6
#   transitions. True dementia pacing is repetitive and purposeless; 8+ transitions in
#   30 min distinguishes it from normal indoor mobility patterns.
#
# nighttime_transition_threshold (3):
#   One bathroom trip = 2 transitions (bedroom→bathroom→bedroom). Normal nocturnal
#   voiding in seniors occurs 1-2x/night. Evaluation starts at 3+ transitions.
#
# absence_threshold_minutes (90):
#   Cameras do not cover every room. 30 min of no camera coverage is normal (cooking,
#   porch sitting, bathroom). 90 min reduces false alerts from normal off-camera
#   activity while still triggering same-day evaluation.
#
# bathroom_absolute_threshold_seconds (2700 = 45 min):
#   Cold-start fallback before 5+ baseline samples exist. Constipation (common with
#   dementia medications) and slow mobility routinely extend bathroom time beyond 30 min.
signal:
  interval_s: 60
  enabled: true
  window_hours: 24
  stillness_threshold_minutes: 60
  stillness_emergency_minutes: 120
  stillness_motion_floor: 0.05
  # An open dwell qualifies for stillness only if observed within this many
  # seconds of now; otherwise it is a stale/orphaned row, not live immobility.
  stillness_open_freshness_s: 180
  # Floor + per-gap cap for re-deriving observed still time from points on the
  # open branch (mirror TrajectoryWriter's still accumulation).
  stillness_still_energy_floor: 0.005
  stillness_max_gap_s: 60.0
  pacing_room_threshold: 8
  pacing_window_minutes: 30
  nighttime_transition_threshold: 3
  absence_threshold_minutes: 90
  bathroom_absolute_threshold_seconds: 2700
  # Advanced tuning: require this many baseline samples before using a robust z-score
  min_baseline_n: 5
  # Cooldown prevents re-alerting for the same episode; severity escalation still fires.
  cooldown_minutes: 60
  # Trigger must hold for this many consecutive runs before first emission.
  onset_consecutive_windows: 2
  # Room names (substrings) treated as resting rooms for stillness severity.
  resting_rooms: ["bed", "bedroom"]
  # Modified z-score gate for sundowning evening activity.
  sundowning_z_threshold: 2.5
  # Modified z-score gates for bathroom dwell anomaly (day / night paths).
  bathroom_z_threshold: 3.5
  bathroom_z_threshold_night: 4.0
  # Minimum trajectory-point density (points/min) required to evaluate pacing.
  pacing_min_obs_density: 0.5
  # Per-kind override: gait trends should not re-page more than weekly.
  gait_slowing_cooldown_minutes: 10080
  # Minimum evening coverage before evaluating sundowning.
  sundowning_min_evening_minutes: 30
  # Worker scalability controls.
  baseline_cache_ttl_minutes: 60
  max_concurrent_identities: 4
  incremental_enabled: true

# Agitation index signal (Milestone 4)
#
# Defaults to disabled (agitation_enabled: false). Enable per-deployment only
# after caregiver annotation feedback (M4 task 3) provides validation evidence.
# Evidence grade: experimental. Severity capped at warning.
#
# Threshold rationale:
#
# agitation_composite_threshold (0.5):
#   Absolute gate before z-score comparison. Below 0.5 the composite is
#   dominated by missing calibration or low motion; z-score comparison at
#   near-zero values is numerically unstable.
#
# agitation_z_threshold (3.0):
#   Modified z-score gate (robust_z). 3.0 corresponds roughly to p>0.999
#   under a Gaussian; chosen conservatively for an experimental signal.
#
# agitation_warning_composite / agitation_warning_z (0.7 / 4.0):
#   Warning tier requires both high absolute composite (0.7) and a strong
#   z-score (4.0) to reduce false positives from brief periods of elevated
#   activity (exercise, social events).
#
# agitation_cooldown_minutes (120):
#   120 min prevents re-alerting after an episode resolves; onset debounce
#   (min_consecutive=2) already excludes single-window transient bursts.
signal.agitation:
  agitation_enabled: false
  agitation_window_minutes: 30
  agitation_min_observed_minutes: 15
  agitation_composite_threshold: 0.5
  agitation_z_threshold: 3.0
  agitation_warning_composite: 0.7
  agitation_warning_z: 4.0
  agitation_cooldown_minutes: 120
  agitation_weight_in_place: 0.5
  agitation_weight_entropy: 0.3
  agitation_weight_excursion: 0.2

# Fall detection fast path (Milestone 2)
#
# Threshold rationale:
#
# max_descent_rate_hps_threshold (0.8):
#   Heights-per-second descent of the hip proxy. Controlled sitting is 0.2-0.4 hps;
#   falls typically exceed 0.8 hps. Reference: lightweight pose fall detection
#   papers (see VISION.md §3.1 citations).
#
# height_ratio_threshold (0.55):
#   Hip height relative to standing anchor. 1.0 = upright; ~0.3 = floor.
#   0.55 distinguishes floor-level lying from seated postures (~0.6-0.7).
#
# lying_score_threshold (0.4):
#   Minimum posture lying score when keypoints ARE available. When keypoints
#   are absent (person flat on floor) the rule passes regardless, since
#   loss of pose right after a descent spike is itself fall evidence.
#
# floor_speed_max_m_s (2.0):
#   Kalman floor speed above which the detection is likely a projection glitch.
#   Actual falls occur at low-to-moderate floor translation; fast-moving
#   bounding boxes are usually mis-calibrated camera artifacts.
#
# escalation_window_s (60):
#   After emitting warning, check for post-event stillness within this window.
#   One minute gives time for the initial motion to settle and a clear
#   stillness pattern to emerge before escalating to emergency.
#
# cooldown_minutes (10):
#   Repeated descent patterns within 10 min escalate severity rather
#   than re-paging the caregiver.
#
# Defaults to disabled (enabled: false). Enable per-deployment after
# fixture proofs pass, like the CTS robustness flags.
fall_detection:
  enabled: false
  min_samples: 5
  max_descent_rate_hps_threshold: 0.8
  height_ratio_threshold: 0.55
  lying_score_threshold: 0.4
  floor_speed_max_m_s: 2.0
  escalation_window_s: 60.0
  stillness_motion_floor: 0.05
  standing_clear_height_ratio: 0.75
  standing_clear_lying_score: 0.2
  cooldown_minutes: 10
  resting_rooms: ["bed", "bedroom"]

# Pipeline tuning
pipeline:
  # Read by: main.py → FrameProcessingPipeline(max_concurrent_frames=)
  max_concurrent_frames: 4
  # Read by: main.py → PipelineConfig(shutdown_timeout=)
  shutdown_timeout_s: 5.0
  # Read by: main.py → PipelineConfig(live_publish_max_hz=)
  # Maximum publish rate per camera for tracking.events (UI live feed).
  # Inference still runs every frame; this caps only the UI-facing stream.
  live_publish_max_hz: 3.0

  # Single switch for depth client construction and the future TD-008 slow-path.
  posture:
    # Read by: main.py → DepthPostureStrategy / FusedPostureStrategy
    depth_slow_path_enabled: false
    depth_slow_path_min_interval_s: 15.0
    depth_slow_path_max_age_s: 60.0

  # Read by: main.py → PersonDetector(conf_threshold=)
  # 0.6 means YOLO must be ≥60% confident to emit a detection box.
  # Below 0.5 causes excessive false positives; above 0.8 misses partial occlusions.
  detector_confidence: 0.7

  # Read by: main.py → PipelineConfig(allow_skeleton=)
  # True only in unit tests that run without a detector.
  allow_skeleton: false

  # minimum detection confidence for keyframe bbox annotations
  min_keyframe_detection_confidence: 0.5

  # Read by: main.py → PipelineConfig(batch_window_s=, max_batch_size=)
  # batch_window_s=0 disables frame batching (process each frame immediately).
  batch_window_s: 0.5
  max_batch_size: 8
  cross_camera_detector_batching: true

  detection:
    # Read by: main.py → PipelineConfig(detection_iou_dedup_threshold=)
    # Drops near-duplicate YOLO boxes that survived the model's baked NMS.
    iou_dedup_threshold: 0.50

  identity:
    # Read by: main.py → PipelineConfig(identity_rewrite_on_face_commit=)
    rewrite_on_face_commit: true

  # Adaptive ReID cadence (M5.1): skip SOLIDER embeddings in unambiguous
  # single-resident steady-state frames.  Ships shadow-first: the policy
  # evaluates and counts would-skip decisions without actually skipping.
  # Flip enabled: true only after shadow rate >= 60 % on single-resident replay.
  adaptive_reid:
    enabled: false
    shadow: true
    # Seconds between mandatory re-embeddings per PH even in steady state.
    refresh_interval_s: 10.0
    # Coarse proximity gate (metres) for matching a detection to nearby PHs.
    proximity_gate_m: 2.0

# Cognitive Companion — camera config source and API gateway
cognitive_companion:
  url: "${CC_API_URL}"
  api_key: "${CC_INGRESS_API_KEY}"

# CC config sync
cc_sync:
  poll_interval_s: 60.0

# Identity resolver — Bayesian posterior parameters
resolver:
  # Operator tunables: review first when field behavior needs adjustment.
  commit_prob: 0.65
  commit_margin: 0.15
  face_weight_multiplier: 3.0
  prior_maintenance_max_age_s: 30.0
  min_quality_to_commit: 0.35
  min_quality_to_face_lock: 0.45
  enable_quality_gate: true
  flip_debounce_window_s: 10.0
  enable_flip_debounce: true
  # Shadow-first guard for duplicate active resident identities. Enable after
  # replay proves same-person cross-camera continuation still works.
  enable_duplicate_active_identity_guard: true
  duplicate_identity_direct_face_min_confidence: 0.90
  # Identity-lock gate for emitted face anchors. This is intentionally stricter
  # than face_id.min_confidence, which only controls whether an anchor is emitted.
  face_commit_min_confidence: 0.70
  arcface_authority_calibrated_confidence: 0.80

  # Advanced / rarely changed constants.
  reid_decision_sim: 0.70
  revision_horizon_s: 600.0
  max_revisions_per_ph_per_minute: 3
  unknown_mass: 0.05
  prior_weight: 0.6
  propagated_face_weight_multiplier: 0.5
  height_weight_multiplier: 1.5
  commit_prob_dense: 0.80
  commit_margin_dense: 0.20
  identified_entry_boost_min_sim: 0.65
  identified_entry_min_likelihood: 0.80
  # The embedding_coherence_* keys only take effect when
  # enable_embedding_coherence_boost is true.
  enable_embedding_coherence_boost: false
  embedding_coherence_window: 5
  embedding_coherence_min_sim: 0.70
  embedding_coherence_boost: 2.0
  # Sticky maintenance — hold committed identity unless strongly contradicted.
  # M2 enabled 2026-06-02 after make ci guardrails (two_people_one_room,
  # resident_plus_stranger) passed green. Staged rollout phase 1.
  enable_sticky_maintenance: true
  contradiction_face_confidence: 0.70
  contradiction_posterior_prob: 0.80
  contradiction_posterior_margin: 0.20

  # Rich face evidence — three-valued recognition weights.
  candidate_face_weight_multiplier: 1.0
  face_present_unknown_unknown_mass: 0.10
  frontality_full_yaw_deg: 15.0
  frontality_zero_yaw_deg: 60.0
  frontality_min_factor: 0.3

  # Synthetic face propagation also requires src_face_confidence * gallery_sim
  # to clear face_commit_min_confidence, so 0.72 remains reachable for true
  # handoffs while refusing weak relative/clothing matches.
  cross_gt_face_propagation_threshold: 0.72
  cross_gt_face_propagation_max_gts: 4
  # Multi-view gallery query — per-orientation ReID with max-over-views.
  # Enabled 2026-06-02 (M4) after the UNKNOWN-complement leak fix and guardrails:
  # back-view retrieval commits via max-over-views; orthogonal stranger stays
  # UNKNOWN. Benefit ramps as the gallery accumulates non-front prototypes.
  enable_multiview_gallery: true
  # Fraction of frames where the multiview-gallery shadow comparison runs
  # while enable_multiview_gallery is false (measurement only). 0.0 = disabled;
  # an always-on shadow doubles gallery load for a measurement nobody sampled.
  multiview_shadow_sample_rate: 0.0
  seed_orientation_min_confidence: 0.5

# Governed ReID gallery candidate creation (M04). The only pipeline write
# path into reid_gallery: ReIDCandidateStage -> create_review_candidate,
# always pending_review, always with crop/frame provenance. require_calibrated_face
# defaults true: without a deployed calibration artifact this fails closed
# (no automatic candidates) rather than seeding on raw ArcFace similarity.
reid_candidates:
  enabled: true
  require_calibrated_face: true
  calibrated_confidence_min: 0.80
  seed_orientation_min_confidence: 0.5
  min_quality: 0.35
  max_per_identity_orientation: 10
  # model_version is read separately from triton.reid_model (the live Triton
  # model identifier); this key only covers the crop preprocessing pipeline.
  preprocessing_version: "v1"

# Keyframe sampler
sampler:
  keyframe_min_interval_s: 30.0
  periodic_expires_hours: 72
  trigger_expires_days: 30

# Person Hypothesis maintenance
person_hypotheses:
  unknown_purge:
    # Deletes only closed PHs with no committed identity. Active unknown PHs stay visible.
    enabled: true
    older_than_days: 7
    interval_s: 3600.0
    batch_size: 1000

# World tracker
world_tracker:
  gate_chi2: 9.21
  alpha_geo: 0.5
  alpha_app: 0.4
  alpha_height: 0.1
  observation_noise_m: 0.25
  process_noise_accel_m_s2: 0.5
  ph_close_grace_s: 15.0
  min_observations_to_publish: 3
  face_conflict_threshold: 0.70
  inferred_handoff_max_s: 600
  inferred_handoff_max_distance_m: 5.0
  initial_position_sigma_m: 1.0
  initial_velocity_sigma_m_s: 2.0
  velocity_decay_s: 3.0
  # ---- Adaptive zero-velocity update (ZUPT) ----
  # Treat only sustained near-still tracks as stationary. Exit begins at the
  # bottom of the clinically relevant slow-shuffle band (0.2-0.4 m/s) so
  # impaired gait still feeds pacing, wandering, and gait analytics.
  zupt_speed_enter_m_s: 0.12
  zupt_speed_exit_m_s: 0.20
  zupt_consecutive_frames: 5
  zupt_innov_chi2: 2.0
  zupt_velocity_sigma_m_s: 0.05
  height_sigma_m: 0.15
  # ---- Observation uncertainty model (M04 information-form fusion) ----
  # Mirror observation_model.py module constants; tune against M09 acceptance fixtures.
  k_cal: 1.0                        # bias-floor gain: R_cal = (k_cal * residual_m)^2 * I (m^2)
  base_footpoint_sigma_px: 4.0      # detector bbox-bottom localization noise (px, 1 sigma)
  occluded_footpoint_inflation: 8.0  # sigma multiplier when feet are hidden or bbox truncated

  # ---- Stabilized primary camera ----
  # A challenger camera must be best-view for this many consecutive tracker
  # frames before snapshot camera_id/keyframe/room fallback switches.
  primary_switch_frames: 5

  # ---- Cross-camera dedup (U1) ----
  dedup_enabled: true
  dedup_max_distance_m: 0.9
  dedup_residual_coeff_k: 1.0
  dedup_max_distance_ceiling_m: 1.5
  dedup_require_no_face_conflict: true
  # ---- PH revival ----
  # M2 enabled 2026-06-02 (phase 1) after make ci guardrails passed.
  enable_ph_revival: true
  revive_max_age_s: 30.0
  revive_max_distance_m: 2.0
  revive_appearance_min_sim: 0.55
  # ---- Uncalibrated association relaxation ----
  # M2 enabled 2026-06-02 (phase 1) after make ci guardrails passed.
  enable_uncalibrated_gate_relax: true
  uncalibrated_gate_chi2: 21.0
  uncalibrated_alpha_app: 0.7
  # ---- Multi-view ReID ----
  # Enabled 2026-06-02 (M4): association appearance cost uses max-over-view
  # prototypes; calibrated single-mean path unchanged. Covered by
  # test_cost_matrix_multiview (back-prototype match) and shadow proofs.
  enable_multiview_association: true

  # ---- Cross-camera revival (M5) ----
  # Enabled 2026-06-02 (stage after M2) once step-level guardrails passed:
  # cross_camera_handoff links identity across cameras; the 2-camera stranger
  # guardrail proves a stranger never inherits a resident's identity. Reads
  # per-PH view_prototypes (no gallery dependency); appearance gate is an
  # absolute cosine floor (cross_camera_revive_appearance_min_sim), not the
  # normalize-to-1 posterior. M4 multiview stays OFF (staged next).
  enable_cross_camera_revival: true
  cross_camera_min_plausibility: 0.05
  cross_camera_revive_appearance_min_sim: 0.60

  # ---- Group appearance dedup (M5) ----
  # Enabled 2026-06-02 for the declared overlap group {cam02,cam03,cam04}.
  # Merges same-perspective uncalibrated obs within a group by appearance; no
  # group => no merge; face conflict blocks. Covered by test_dedup group cases.
  # Requires the overlap group declared CC-side (cts_camera_overlap_groups).
  enable_group_appearance_dedup: true
  dedup_group_appearance_min_sim: 0.75

  # ---- Low-confidence detection recovery (M2.3 BYTE-style second association) ----
  # Default OFF. Enable per-deployment after fixture proofs pass (same rollout
  # pattern as M1-M6). When on, YOLO detections in [low_confidence_floor,
  # pipeline.detector_confidence) are offered in a second association pass
  # against already-open PHs only, with a tightened geometric gate.
  # False-negative risk: defended by stillness pathway (defense in depth).
  # False-positive (ghost) risk: bounded — a stale ghost PH can at most delay
  # PH close by ph_close_grace_s; it cannot spawn a new PH or contaminate
  # identity/gallery state (observation_count and gallery_mean are never updated
  # by the low-band pass, and low-band observations are not persisted).
  enable_low_confidence_recovery: false
  # Minimum YOLO confidence to include in the low band (detections below this
  # are discarded; detections at or above pipeline.detector_confidence remain
  # on the primary high-confidence path unaffected).
  low_confidence_floor: 0.25
  # Chi-squared gate for the second association pass (95% with 2 dof = 5.99,
  # tighter than the primary 9.21 to bound ghost-persistence risk).
  recovery_gate_chi2: 5.99
  # Diagnostic, read-only: when true (and recovery false), the detect stage
  # decodes at low_confidence_floor and records cts_detector_band_frames_total
  # {band=high|low_only|empty} + cts_detector_lowband_boxes_total, to measure
  # whether the detector_confidence cut is hiding present people. Does NOT change
  # tracking (the low band is only counted, never fed to the tracker).
  # TEMPORARILY ENABLED for the detection-gap root-cause measurement (2026-06-17);
  # revert to false once the capture is complete.
  measure_low_confidence_band: false

  # ---- Association covariance/point validation (M03) ----
  # Fail-closed validation of floor points and observation covariance before the
  # Mahalanobis gate. Non-finite points/covariance ALWAYS gate out regardless of
  # this flag (pure safety); this toggles the symmetry/PSD/trace-cap checks.
  # Default true: an invalid covariance must never gate-match. Flip false only
  # for development A/B comparison.
  enable_covariance_validation: true
  # Reject observation covariance whose position-trace exceeds this (m^2). Above
  # any legitimate observation covariance (largest fixture trace is 8.0), below
  # the inflated magnitudes that would otherwise rescue an implausible jump.
  covariance_max_trace_m2: 20.0
  covariance_symmetry_tol_m2: 0.000001
  covariance_psd_tol_m2: -0.000000001

  # ---- Typed authoritative identity evidence (M03 task 5; plumbed M12) ----
  # Verified-ReID disagreement is a configurable strong cost, never a hard gate.
  # M12 wired the per-observation verified-ReID identity input: when this flag
  # is true, WorldTracker resolves each observation's identity from the
  # operator_verified gallery before association and passes it in, so a body
  # whose verified-ReID identity disagrees with a PH's committed identity pays
  # reid_disagreement_cost. Left false pending the release-gated two-person
  # golden-replay acceptance (see identity-integrity-rollout). Flipping it
  # turns on the pre-association gallery lookup, so flip only after acceptance.
  enable_reid_disagreement_cost: false
  reid_disagreement_cost: 0.6
  # Minimum gallery cosine similarity for accepting a top operator_verified hit
  # as an observation's verified-ReID identity. Consulted only when the flag
  # above is true.
  reid_disagreement_min_similarity: 0.5

  # ---- PH-local appearance contamination guard (M03 tasks 7-9) ----
  # One bad association must not immediately pollute a PH's appearance state.
  # An embedding updates gallery_mean / view prototypes / mean_quality only when
  # finite, non-degenerate, quality-qualified, orientation-valid, and either
  # consistent with the matching orientation prototype or initialising a new
  # qualified orientation. Default true: this is a property of the shipped
  # milestone; the flag is a kill-switch that defaults ON for rollback only.
  enable_appearance_outlier_rejection: true
  appearance_min_quality: 0.30
  # L2 norm at/below this is degenerate (zero vector) and rejected; real SOLIDER
  # embeddings are unit length and pass, non-unit vectors are normalised for the
  # cross-person cosine comparison.
  appearance_embedding_norm_tol: 0.000001
  # Cosine floor against the matching orientation prototype; below it an
  # established orientation's embedding is treated as a cross-person outlier.
  appearance_outlier_min_sim: 0.35
  # Minimum orientation confidence to initialise a NEW orientation prototype.
  appearance_new_orientation_min_confidence: 0.30

# Gait and mobility analytics (Milestone 3)
#
# Threshold rationale:
#
# bout_min_speed_m_s (0.3):
#   Captures the slow tail of impaired indoor walking (~0.4-1.0 m/s comfortable)
#   without triggering on postural sway or standing drift.
#
# bout_min_duration_s (3.0):
#   Eliminates incidental steps and balance corrections; 3 s is roughly 2-4
#   strides at 0.5 m/s and is the shortest clinically meaningful gait sample.
#
# bout_close_grace_s (2.0):
#   Bridges brief dips below threshold (momentary slow turns, doorway hesitation)
#   without merging truly separate bouts.  Matches the inter-bout gap used in
#   validated wearable gait algorithms.
#
# max_plausible_speed_m_s (2.5):
#   Above this value the floor projection is almost certainly a calibration
#   glitch (no ambulatory elderly person walks faster than ~2 m/s indoors).
#   Glitch samples are excluded without closing the active bout.
gait:
  enabled: true
  bout_min_speed_m_s: 0.3
  bout_min_duration_s: 3.0
  bout_close_grace_s: 2.0
  max_plausible_speed_m_s: 2.5
  # Aggregator: recompute today + yesterday daily summaries every hour.
  aggregate_interval_s: 3600
  # Aggregator: minimum bouts / walking seconds for the trend detector to treat
  # a day as data-rich.  Sparse days still get a row; the signal gates on this.
  min_daily_bouts: 3
  min_daily_walking_s: 60

# Environment label (dev / staging / production)
env: production

# Logging
logging:
  level: INFO
