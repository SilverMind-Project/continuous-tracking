# Tracking Orchestrator — settings
# Environment variables are interpolated with ${VAR} or ${VAR:-default} syntax.

# Deployment timezone — must match cognitive-companion's app.timezone so that
# time-of-day signals (sundowning, nighttime movement) are computed in local
# time rather than UTC.  IANA tz database name, e.g. "America/New_York".
app:
  timezone: "${CTS_TIMEZONE:-America/New_York}"

# Redis Streams transport
redis:
  url: "${REDIS_URL:-redis://localhost:6379/0}"
  consumer_group: "${CTS_CONSUMER_GROUP:-cts-orchestrator}"
  consumer_name: "${CTS_CONSUMER_NAME:-orchestrator-1}"
  frames_stream: "${CTS_FRAMES_STREAM:-frames.ready}"
  events_stream: "${CTS_EVENTS_STREAM:-tracking.events}"
  responses_stream: "${CTS_RESPONSES_STREAM:-tracking.responses}"
  revisions_stream: "${CTS_REVISIONS_STREAM:-tracking.revisions}"
  signals_stream: "${CTS_SIGNALS_STREAM:-tracking.signals}"
  scene_samples_stream: "${CTS_SCENE_SAMPLES_STREAM:-scene.samples}"
  stream_maxlen: "${CTS_STREAM_MAXLEN:-100000}"
  batch_max_wait_ms: "${CTS_BATCH_MAX_WAIT_MS:-100}"
  batch_max_size: "${CTS_BATCH_MAX_SIZE:-8}"
  xack_timeout_ms: "${CTS_XACK_TIMEOUT_MS:-5000}"
  ack_ttl_seconds: "${CTS_ACK_TTL_SECONDS:-300}"

# PostgreSQL database
database:
  url: "${DATABASE_URL:-}"

# Triton Inference Server
triton:
  url: "${TRITON_GRPC_URL:-}"
  person_detector_model: "${TRITON_DETECTOR_MODEL:-person-detector}"
  reid_model: "${TRITON_REID_MODEL:-reid-solider}"
  pose_model: "${TRITON_POSE_MODEL:-pose-rtmpose}"
  pose_enabled: "${TRITON_POSE_ENABLED:-true}"
  depth_enabled: "${TRITON_DEPTH_ENABLED:-true}"
  depth_model: "${TRITON_DEPTH_MODEL:-depth-anything-v2}"
  timeout_ms: "${TRITON_TIMEOUT_MS:-5000}"

# MinIO / S3-compatible object storage
minio:
  endpoint: "${MINIO_ENDPOINT_URL:-}"
  bucket: "${MINIO_BUCKET:-ai-media}"
  access_key: "${MINIO_ACCESS_KEY:-}"
  secret_key: "${MINIO_SECRET_KEY:-}"
  region: "${AWS_REGION:-us-east-1}"
  secure: "${MINIO_SECURE:-false}"

# Face identification via person-identification-service (ArcFace)
# Per-camera overrides (enabled/disabled, min_confidence) are fetched from
# cognitive-companion at startup.  FACE_ID_CAMERA_CONFIDENCE env var
# provides a deployment-level fallback for cameras not in CC.
face_id:
  url: "${PERSON_ID_SERVICE_URL:-}"
  cooldown_s: "${FACE_ID_COOLDOWN_S:-5.0}"
  timeout_s: "${FACE_ID_TIMEOUT_S:-2.0}"
  min_confidence: "${FACE_ID_MIN_CONFIDENCE:-0.6}"

# Dementia signal computation
#
# Threshold rationale (all values are evidence-based):
#
# stillness_threshold_minutes (60):
#   Clinically meaningful seated immobility in dementia occurs after ~60 min, not 30.
#   Desk work, reading, and TV watching routinely exceed 30 min without clinical concern.
#   Reference: Alzheimer's Association caregiver guidelines; NICE NG97.
#
# stillness_motion_floor (0.02):
#   Normal breathing and micro-adjustments produce ambient motion energy ≈ 0.01-0.02.
#   The original 0.005 floor was below normal physiological ambient motion.
#
# pacing_room_threshold (8):
#   Purpose-driven ambulation (kitchen→living room→bathroom) routinely produces 5-6
#   transitions. True dementia pacing is repetitive and purposeless; 8+ transitions in
#   30 min distinguishes it from normal indoor mobility patterns.
#
# nighttime_transition_threshold (3):
#   One bathroom trip = 2 transitions (bedroom→bathroom→bedroom). Normal nocturnal
#   voiding in seniors occurs 1-2x/night. Evaluation starts at 3+ transitions.
#
# absence_threshold_minutes (60):
#   Cameras do not cover every room. 30 min of no camera coverage is normal (cooking,
#   porch sitting, bathroom). 60 min triggers initial evaluation.
#
# bathroom_absolute_threshold_seconds (2700 = 45 min):
#   Cold-start fallback before 5+ baseline samples exist. Constipation (common with
#   dementia medications) and slow mobility routinely extend bathroom time beyond 30 min.
signal:
  interval_s: "${SIGNAL_INTERVAL_S:-60}"
  enabled: "${SIGNAL_ENABLED:-true}"
  stillness_threshold_minutes: "${SIGNAL_STILLNESS_THRESHOLD_MINUTES:-60}"
  stillness_emergency_minutes: "${SIGNAL_STILLNESS_EMERGENCY_MINUTES:-120}"
  stillness_motion_floor: "${SIGNAL_STILLNESS_MOTION_FLOOR:-0.02}"
  pacing_room_threshold: "${SIGNAL_PACING_ROOM_THRESHOLD:-8}"
  pacing_window_minutes: "${SIGNAL_PACING_WINDOW_MINUTES:-30}"
  nighttime_transition_threshold: "${SIGNAL_NIGHTTIME_TRANSITION_THRESHOLD:-3}"
  absence_threshold_minutes: "${SIGNAL_ABSENCE_THRESHOLD_MINUTES:-90}"
  bathroom_absolute_threshold_seconds: "${SIGNAL_BATHROOM_COLD_START_S:-2700}"

# Pipeline tuning
pipeline:
  # Read by: main.py → FrameProcessingPipeline(max_concurrent_frames=)
  max_concurrent_frames: "${MAX_CONCURRENT_FRAMES:-4}"
  # Read by: main.py → PipelineConfig(shutdown_timeout=)
  shutdown_timeout_s: "${PIPELINE_SHUTDOWN_TIMEOUT_S:-5.0}"

  posture:
    # Read by: main.py → DepthPostureStrategy / FusedPostureStrategy
    depth_slow_path_enabled: "${POSTURE_DEPTH_SLOW_PATH_ENABLED:-false}"
    depth_slow_path_min_interval_s: "${POSTURE_DEPTH_SLOW_PATH_MIN_INTERVAL_S:-15.0}"
    depth_slow_path_max_age_s: "${POSTURE_DEPTH_SLOW_PATH_MAX_AGE_S:-60.0}"

  # Read by: main.py → PersonDetector(conf_threshold=)
  # 0.6 means YOLO must be ≥60% confident to emit a detection box.
  # Below 0.5 causes excessive false positives; above 0.8 misses partial occlusions.
  detector_confidence: "${DETECTOR_CONFIDENCE:-0.7}"

  # Read by: main.py → PipelineConfig(allow_skeleton=)
  # True only in unit tests that run without a detector.
  allow_skeleton: "${PIPELINE_ALLOW_SKELETON:-false}"

  # Read by: main.py → PipelineConfig(batch_window_s=, max_batch_size=)
  # batch_window_s=0 disables frame batching (process each frame immediately).
  batch_window_s: "${PIPELINE_BATCH_WINDOW_S:-0.5}"
  max_batch_size: "${PIPELINE_MAX_BATCH_SIZE:-5}"

  detection:
    # Read by: main.py → PipelineConfig(detection_iou_dedup_threshold=)
    # Drops near-duplicate YOLO boxes that survived the model's baked NMS.
    iou_dedup_threshold: "${PIPELINE_DETECTION_IOU_DEDUP:-0.50}"

  tracker:
    # Read by: main.py → PipelineConfig(tracker_dedup_iou_threshold=)
    # Newly-spawned tracklets overlapping an established track (age ≥5 frames)
    # by more than this IoU are immediately dropped.
    dedup_iou_threshold: "${PIPELINE_TRACKER_DEDUP_IOU:-0.7}"

    # Read by: main.py → PipelineConfig(tracker_min_frames_to_publish=)
    # Tracklets must survive this many detection frames before being exposed
    # to cross-camera association, identity resolution, and publication.
    # Higher values reduce ghost tracks; lower values reduce detection lag.
    min_frames_to_publish: "${PIPELINE_TRACKER_MIN_FRAMES:-5}"

  identity:
    # Read by: main.py → PipelineConfig(identity_commit_window_s=)
    # At most one identity commit per global track per N seconds.
    commit_window_s: "${PIPELINE_IDENTITY_COMMIT_WINDOW_S:-3.0}"

    # Read by: main.py → PipelineConfig(identity_high_confidence_face_threshold=)
    # Face anchors above this confidence bypass the commit window and commit
    # immediately with applies_from = track.first_seen_at.
    high_confidence_face_threshold: "${PIPELINE_IDENTITY_HC_FACE_THRESHOLD:-0.85}"

    # Read by: main.py → PipelineConfig(gallery_identity_backfill_delay_s=)
    gallery_backfill_delay_s: "${PIPELINE_GALLERY_BACKFILL_DELAY_S:-10.0}"

    # Read by: main.py → PipelineConfig(identity_rewrite_on_face_commit=)
    rewrite_on_face_commit: "${PIPELINE_IDENTITY_REWRITE_ON_FACE_COMMIT:-true}"

# Cognitive Companion — camera config source and API gateway
cognitive_companion:
  url: "${CC_API_URL:-}"
  api_key: "${CC_INGRESS_API_KEY:-}"

# Identity resolver — Bayesian posterior parameters
resolver:
  commit_prob: "${RESOLVER_COMMIT_PROB:-0.65}"
  commit_margin: "${RESOLVER_COMMIT_MARGIN:-0.15}"
  reid_decision_sim: "${RESOLVER_REID_DECISION_SIM:-0.70}"
  revision_horizon_s: "${RESOLVER_REVISION_HORIZON_S:-600.0}"
  max_revisions_per_gt_per_minute: "${RESOLVER_MAX_REVISIONS_PER_GT_PER_MINUTE:-3}"
  unknown_mass: "${RESOLVER_UNKNOWN_MASS:-0.05}"
  prior_weight: "${RESOLVER_PRIOR_WEIGHT:-0.6}"
  face_weight_multiplier: "${RESOLVER_FACE_WEIGHT_MULTIPLIER:-3.0}"
  propagated_face_weight_multiplier: "${RESOLVER_PROPAGATED_FACE_WEIGHT_MULTIPLIER:-0.5}"
  height_weight_multiplier: "${RESOLVER_HEIGHT_WEIGHT_MULTIPLIER:-1.5}"
  commit_prob_dense: "${RESOLVER_COMMIT_PROB_DENSE:-0.80}"
  commit_margin_dense: "${RESOLVER_COMMIT_MARGIN_DENSE:-0.20}"
  prior_maintenance_max_age_s: "${RESOLVER_PRIOR_MAINTENANCE_MAX_AGE_S:-120.0}"
  identified_entry_boost_min_sim: "${RESOLVER_IDENTIFIED_ENTRY_BOOST_MIN_SIM:-0.65}"
  identified_entry_min_likelihood: "${RESOLVER_IDENTIFIED_ENTRY_MIN_LIKELIHOOD:-0.80}"
  enable_embedding_coherence_boost: "${RESOLVER_ENABLE_EMBEDDING_COHERENCE_BOOST:-false}"
  embedding_coherence_window: "${RESOLVER_EMBEDDING_COHERENCE_WINDOW:-5}"
  embedding_coherence_min_sim: "${RESOLVER_EMBEDDING_COHERENCE_MIN_SIM:-0.70}"
  embedding_coherence_boost: "${RESOLVER_EMBEDDING_COHERENCE_BOOST:-2.0}"
  face_commit_min_confidence: "${RESOLVER_FACE_COMMIT_MIN_CONFIDENCE:-0.70}"
  face_lock_maintenance_max_age_s: "${RESOLVER_FACE_LOCK_MAINTENANCE_MAX_AGE_S:-300}"
  cross_gt_face_propagation_threshold: "${RESOLVER_CROSS_GT_FACE_PROPAGATION_THRESHOLD:-0.65}"
  cross_gt_face_propagation_max_gts: "${RESOLVER_CROSS_GT_FACE_PROPAGATION_MAX_GTS:-4}"

# Tracklet lifecycle
tracklet:
  min_hit_ratio: "${TRACKLET_MIN_HIT_RATIO:-0.5}"
  close_grace_frames: "${TRACKLET_CLOSE_GRACE_FRAMES:-30}"
  gallery_min_quality: "${TRACKLET_GALLERY_MIN_QUALITY:-0.4}"
  gallery_max_per_tracklet: "${TRACKLET_GALLERY_MAX_PER_TRACKLET:-20}"
  # Second-line detection gate inside the tracker. Must be < pipeline.detector_confidence
  # (currently 0.6). Effectively a no-op in normal operation; protects against
  # future changes to the detector that lower its internal threshold.
  min_detection_confidence: "${TRACKLET_MIN_DETECTION_CONFIDENCE:-0.3}"
  enabled: "${TRACKLET_ENABLED:-true}"
  # min_frames_to_publish is controlled by pipeline.tracker.min_frames_to_publish

# Cross-camera association
cross_camera:
  alpha: "${CC_ALPHA:-0.7}"
  floor_sigma_m: "${CC_FLOOR_SIGMA_M:-1.5}"
  max_floor_distance_m: "${CC_MAX_FLOOR_DISTANCE_M:-8.0}"
  min_link_score: "${CC_MIN_LINK_SCORE:-0.50}"
  unknown_merge_appearance_threshold: "${CC_UNKNOWN_MERGE_APPEARANCE_THRESHOLD:-0.90}"
  within_group_min_score: "${CC_WITHIN_GROUP_MIN_SCORE:-0.35}"
  inter_gt_consolidation_appearance_threshold: "${CC_INTER_GT_CONSOLIDATION_APPEARANCE_THRESHOLD:-0.82}"
  known_identity_reentry_threshold: "${CC_KNOWN_IDENTITY_REENTRY_THRESHOLD:-0.70}"
  same_camera_reentry_max_gap_s: "${CC_SAME_CAMERA_REENTRY_MAX_GAP_S:-30.0}"
  unknown_merge_max_gap_s: "${CC_UNKNOWN_MERGE_MAX_GAP_S:-120.0}"
  unknown_merge_max_distance_m: "${CC_UNKNOWN_MERGE_MAX_DISTANCE_M:-2.0}"

# Keyframe sampler
sampler:
  keyframe_min_interval_s: "${SAMPLER_KEYFRAME_MIN_INTERVAL_S:-30.0}"
  periodic_expires_hours: "${SAMPLER_PERIODIC_EXPIRES_HOURS:-72}"
  trigger_expires_days: "${SAMPLER_TRIGGER_EXPIRES_DAYS:-30}"

# Environment label (dev / staging / production)
env: "${CTS_ENV:-production}"

# Logging
logging:
  level: "${LOG_LEVEL:-INFO}"
