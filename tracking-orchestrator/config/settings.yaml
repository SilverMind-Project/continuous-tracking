# Tracking Orchestrator — settings
# Deployment-only values are interpolated with ${VAR}. Runtime tunables are
# literal values in this file to avoid hidden env-var override surfaces.
# Settings blocks are grouped by operator tunables first, advanced or reserved
# constants second. The loader reads every key explicitly in app/main.py.

# Deployment timezone — must match cognitive-companion's app.timezone so that
# time-of-day signals (sundowning, nighttime movement) are computed in local
# time rather than UTC.  IANA tz database name, e.g. "America/New_York".
app:
  timezone: America/New_York

# Redis Streams transport
redis:
  url: "${REDIS_URL}"
  consumer_group: cts-orchestrator
  consumer_name: orchestrator-1
  frames_stream: frames.ready
  events_stream: tracking.events
  responses_stream: tracking.responses
  revisions_stream: tracking.revisions
  signals_stream: tracking.signals
  scene_samples_stream: scene.samples
  batch_max_wait_ms: 100
  batch_max_size: 8
  xack_timeout_ms: 5000
  ack_ttl_seconds: 300

# PostgreSQL database
database:
  url: "${DATABASE_URL}"

# Triton Inference Server
triton:
  url: "${TRITON_GRPC_URL}"
  person_detector_model: person-detector
  detector_static_batch_size: 8
  reid_model: reid-solider
  pose_model: pose-rtmpose
  pose_enabled: true
  # Reserved for M7 (occluded posture); depth slow-path not yet wired. See TD-008.
  depth_enabled: true
  # Reserved for M7 (occluded posture); depth slow-path not yet wired. See TD-008.
  depth_model: depth-anything-v2
  timeout_ms: 5000
  startup_wait_s: 120
  startup_retry_interval_s: 5

# MinIO / S3-compatible object storage
minio:
  endpoint: "${MINIO_ENDPOINT_URL}"
  bucket: "${MINIO_BUCKET}"
  access_key: "${MINIO_ACCESS_KEY}"
  secret_key: "${MINIO_SECRET_KEY}"
  region: us-east-1
  secure: false

# Face identification via person-identification-service (ArcFace)
# Per-camera overrides (enabled/disabled, min_confidence) are fetched from
# cognitive-companion at startup.
face_id:
  url: "${PERSON_ID_SERVICE_URL}"
  cooldown_s: 5.0
  timeout_s: 2.0
  # Face-ID emission gate: service matches below this confidence are dropped
  # before becoming face anchors. Resolver face_commit_min_confidence is the
  # stricter identity-lock gate after an anchor exists.
  min_confidence: 0.6
  enabled: true

# Dementia signal computation
#
# Threshold rationale (all values are evidence-based):
#
# stillness_threshold_minutes (60):
#   Clinically meaningful seated immobility in dementia occurs after ~60 min, not 30.
#   Desk work, reading, and TV watching routinely exceed 30 min without clinical concern.
#   Reference: Alzheimer's Association caregiver guidelines; NICE NG97.
#
# stillness_motion_floor (0.02):
#   Normal breathing and micro-adjustments produce ambient motion energy ≈ 0.01-0.02.
#   The original 0.005 floor was below normal physiological ambient motion.
#
# pacing_room_threshold (8):
#   Purpose-driven ambulation (kitchen→living room→bathroom) routinely produces 5-6
#   transitions. True dementia pacing is repetitive and purposeless; 8+ transitions in
#   30 min distinguishes it from normal indoor mobility patterns.
#
# nighttime_transition_threshold (3):
#   One bathroom trip = 2 transitions (bedroom→bathroom→bedroom). Normal nocturnal
#   voiding in seniors occurs 1-2x/night. Evaluation starts at 3+ transitions.
#
# absence_threshold_minutes (90):
#   Cameras do not cover every room. 30 min of no camera coverage is normal (cooking,
#   porch sitting, bathroom). 90 min reduces false alerts from normal off-camera
#   activity while still triggering same-day evaluation.
#
# bathroom_absolute_threshold_seconds (2700 = 45 min):
#   Cold-start fallback before 5+ baseline samples exist. Constipation (common with
#   dementia medications) and slow mobility routinely extend bathroom time beyond 30 min.
signal:
  interval_s: 60
  enabled: true
  stillness_threshold_minutes: 60
  stillness_emergency_minutes: 120
  stillness_motion_floor: 0.02
  pacing_room_threshold: 8
  pacing_window_minutes: 30
  nighttime_transition_threshold: 3
  absence_threshold_minutes: 90
  bathroom_absolute_threshold_seconds: 2700

# Pipeline tuning
pipeline:
  # Read by: main.py → FrameProcessingPipeline(max_concurrent_frames=)
  max_concurrent_frames: 4
  # Read by: main.py → PipelineConfig(shutdown_timeout=)
  shutdown_timeout_s: 5.0

  # Reserved for M7 (occluded posture); depth slow-path not yet wired. See TD-008.
  posture:
    # Read by: main.py → DepthPostureStrategy / FusedPostureStrategy
    depth_slow_path_enabled: false
    depth_slow_path_min_interval_s: 15.0
    depth_slow_path_max_age_s: 60.0

  # Read by: main.py → PersonDetector(conf_threshold=)
  # 0.6 means YOLO must be ≥60% confident to emit a detection box.
  # Below 0.5 causes excessive false positives; above 0.8 misses partial occlusions.
  detector_confidence: 0.7

  # Read by: main.py → PipelineConfig(allow_skeleton=)
  # True only in unit tests that run without a detector.
  allow_skeleton: false

  # M3: minimum detection confidence for keyframe bbox annotations
  min_keyframe_detection_confidence: 0.5

  # Read by: main.py → PipelineConfig(batch_window_s=, max_batch_size=)
  # batch_window_s=0 disables frame batching (process each frame immediately).
  batch_window_s: 0.5
  max_batch_size: 8
  cross_camera_detector_batching: true

  detection:
    # Read by: main.py → PipelineConfig(detection_iou_dedup_threshold=)
    # Drops near-duplicate YOLO boxes that survived the model's baked NMS.
    iou_dedup_threshold: 0.50

  identity:
    # Read by: main.py → PipelineConfig(identity_commit_window_s=)
    # At most one identity commit per PH per N seconds.
    commit_window_s: 5.0

    # Read by: main.py → PipelineConfig(identity_high_confidence_face_threshold=)
    # Face anchors above this confidence bypass the commit window and commit
    # immediately with applies_from = track.first_seen_at.
    high_confidence_face_threshold: 0.85

    # Read by: main.py → PipelineConfig(gallery_identity_backfill_delay_s=)
    gallery_backfill_delay_s: 10.0

    # Read by: main.py → PipelineConfig(identity_rewrite_on_face_commit=)
    rewrite_on_face_commit: true

# Cognitive Companion — camera config source and API gateway
cognitive_companion:
  url: "${CC_API_URL}"
  api_key: "${CC_INGRESS_API_KEY}"

# CC config sync (M2)
cc_sync:
  poll_interval_s: 60.0

# Identity resolver — Bayesian posterior parameters
resolver:
  # Operator tunables: review first when field behavior needs adjustment.
  commit_prob: 0.65
  commit_margin: 0.15
  face_weight_multiplier: 3.0
  prior_maintenance_max_age_s: 120.0
  min_quality_to_commit: 0.35
  min_quality_to_face_lock: 0.45
  enable_quality_gate: true
  flip_debounce_window_s: 10.0
  enable_flip_debounce: true
  # Identity-lock gate for emitted face anchors. This is intentionally stricter
  # than face_id.min_confidence, which only controls whether an anchor is emitted.
  face_commit_min_confidence: 0.70
  face_lock_maintenance_max_age_s: 300

  # Advanced / rarely changed constants.
  reid_decision_sim: 0.70
  revision_horizon_s: 600.0
  max_revisions_per_ph_per_minute: 3
  unknown_mass: 0.05
  prior_weight: 0.6
  propagated_face_weight_multiplier: 0.5
  height_weight_multiplier: 1.5
  commit_prob_dense: 0.80
  commit_margin_dense: 0.20
  identified_entry_boost_min_sim: 0.65
  identified_entry_min_likelihood: 0.80
  # The embedding_coherence_* keys only take effect when
  # enable_embedding_coherence_boost is true. M3 evaluates enabling this path.
  enable_embedding_coherence_boost: false
  embedding_coherence_window: 5
  embedding_coherence_min_sim: 0.70
  embedding_coherence_boost: 2.0
  # Synthetic face propagation also requires src_face_confidence * gallery_sim
  # to clear face_commit_min_confidence, so 0.72 remains reachable for true
  # handoffs while refusing weak relative/clothing matches.
  cross_gt_face_propagation_threshold: 0.72
  cross_gt_face_propagation_max_gts: 4

# Keyframe sampler
sampler:
  keyframe_min_interval_s: 30.0
  periodic_expires_hours: 72
  trigger_expires_days: 30

# World tracker (M1 floor-plane Kalman tracker)
world_tracker:
  gate_chi2: 9.21
  alpha_geo: 0.5
  alpha_app: 0.4
  alpha_height: 0.1
  observation_noise_m: 0.25
  process_noise_accel_m_s2: 0.5
  ph_close_grace_s: 15.0
  min_observations_to_publish: 3
  face_conflict_threshold: 0.70
  inferred_handoff_max_s: 600
  inferred_handoff_max_distance_m: 5.0
  initial_position_sigma_m: 1.0
  initial_velocity_sigma_m_s: 2.0
  velocity_decay_s: 3.0
  height_sigma_m: 0.15
  # ---- Cross-camera dedup (U1) ----
  dedup_enabled: true
  dedup_max_distance_m: 0.9
  dedup_residual_coeff_k: 1.0
  dedup_max_distance_ceiling_m: 1.5
  dedup_require_no_face_conflict: true

# Environment label (dev / staging / production)
env: production

# Logging
logging:
  level: INFO
