# Tracking Orchestrator — settings
# Deployment-only values are interpolated with ${VAR}. Runtime tunables are
# literal values in this file to avoid hidden env-var override surfaces.
# Settings blocks are grouped by operator tunables first, advanced or reserved
# constants second. The loader reads every key explicitly in app/main.py.

# Deployment timezone — must match cognitive-companion's app.timezone so that
# time-of-day signals (sundowning, nighttime movement) are computed in local
# time rather than UTC.  IANA tz database name, e.g. "America/New_York".
app:
  timezone: America/New_York

# Redis Streams transport
redis:
  url: "${REDIS_URL}"
  consumer_group: cts-orchestrator
  consumer_name: orchestrator-1
  frames_stream: frames.ready
  events_stream: tracking.events
  revisions_stream: tracking.revisions
  signals_stream: tracking.signals
  scene_samples_stream: scene.samples
  presence_stream: tracking.presence
  dwell_stream: tracking.dwell
  wearable_fixes_stream: wearable.fixes
  wearable_capabilities_stream: wearable.capabilities
  household_presence_stream: cc.household_presence
  batch_max_wait_ms: 100
  batch_max_size: 8
  xack_timeout_ms: 5000
  ack_ttl_seconds: 300
  pending_reclaim_min_idle_s: 300

# PostgreSQL database
database:
  url: "${DATABASE_URL}"

# Triton Inference Server
triton:
  url: "${TRITON_GRPC_URL}"
  person_detector_model: person-detector
  detector_static_batch_size: 8
  # Enable dynamic-batch detector (person-detector-dynamic). False = static
  # batch-8 (default, Jetson-compatible). Set person_detector_model to
  # person-detector-dynamic when enabling this flag.
  detector_dynamic_batch: false
  reid_model: reid-solider
  pose_model: pose-rtmpose
  pose_enabled: true
  # Model address used only when pipeline.posture.depth_slow_path_enabled is true.
  depth_model: depth-anything-v2
  timeout_ms: 5000
  startup_wait_s: 120
  startup_retry_interval_s: 5

# MinIO / S3-compatible object storage
minio:
  endpoint: "${MINIO_ENDPOINT_URL}"
  bucket: "${MINIO_BUCKET}"
  access_key: "${MINIO_ACCESS_KEY}"
  secret_key: "${MINIO_SECRET_KEY}"
  region: us-east-1
  secure: false

# Face identification via person-identification-service (ArcFace)
# Per-camera profiles (role, face_id_enabled, face_id_min_raw_similarity, FOV, height, tilt)
# are fetched from cognitive-companion at startup and refreshed on every CC config sync poll.
face_id:
  url: "${PERSON_ID_SERVICE_URL}"
  cooldown_s: 5.0
  # Shorter face-ID cooldown for cameras declared with role "face_capable" (identification points).
  identification_point_cooldown_s: 1.0
  timeout_s: 2.0
  # Face-ID emission gate under the "legacy" evidence policy: recognized faces whose raw ArcFace
  # cosine similarity is below this floor are dropped before becoming face anchors. Resolver
  # face_commit_min_similarity is the stricter identity-lock gate after an anchor exists.
  min_raw_similarity: 0.6
  # Which recognized faces become evidence and how the resolver weighs them (one key for both).
  # "legacy": faces below min_raw_similarity are dropped; recognized faces weigh by the tanh
  # heuristic. "calibrated": every recognized face is emitted (a per-camera floor from CC still
  # applies) and weighs by its calibrated confidence; a face without one (a resident outside the
  # calibration artifact's coverage) weighs at most resolver.uncalibrated_face_max_likelihood and
  # only corroborates other evidence. "shadow": live as "legacy", and the faces only "calibrated"
  # would emit are evaluated alongside; outcomes are counted in cts_face_shadow_outcomes_total
  # (log event calibrated_face_shadow_mismatch). Flip to "calibrated" only with a ready
  # calibration artifact covering the residents, after 7 days of shadow, when reviewed
  # would_change_identity cases are 90% or more correct and reviewed would_commit_new cases name
  # the wrong person at most 2% of the time. Rollback is setting "legacy".
  evidence_policy: shadow
  enabled: true
  # M10: expected calibration versions. calibrated_confidence is set to None
  # when the person-id response carries a different model or preprocessing version,
  # ensuring the authority gate fails closed on model mismatches.
  expected_arcface_model_version: "buffalo_l"
  expected_preprocessing_version: "v1"
  # Face-quality scorer the calibration artifact was fitted on. A calibrated confidence from any
  # other scorer, or from a calibration profile other than single_frame, is ignored (fail closed).
  expected_quality_version: "heuristic-v1"
  # A face is attributed to a person only if its centre lies in the person's head region: the top
  # head_region_height_frac of the person box, widened by head_region_side_margin_frac of the box
  # width on each side. Standing, walking, and seated people keep their face in the top 35%; a
  # face elsewhere in the crop belongs to someone overlapping them. Two faces in the region give
  # no attribution (Unknown is preferable to a swap).
  head_region_height_frac: 0.35
  head_region_side_margin_frac: 0.10
  # The face crop is the person box padded upward and sideways (never downward), as fractions of
  # the box size, because SCRFD needs context around the head and detector boxes often cut the
  # head at their top edge. Privacy zones are already blurred in the frame, so padding cannot
  # expose them.
  crop_pad_top_frac: 0.15
  crop_pad_side_frac: 0.10
  # JPEG quality for face crops sent to person-identification-service. Frames are already JPEG
  # (ingress q85) on top of H.264; q95 roughly halves the extra re-encoding error of q90 for
  # about 1.6x the bytes on crops well under 100 kB. Lossless PNG costs 5 to 10x for no
  # measurable gain on an already lossy source.
  crop_jpeg_quality: 95

# Per-PH face templates: the best faces seen on one tracked person, matched together by
# person-identification-service, so several small faces of a walking person can identify them when
# none can alone. A template is always weighed as calibrated evidence: before a template
# calibration artifact is deployed (person-id calibration.template_artifact_path) it is capped and
# only corroborates. Embeddings are held in memory only, never logged or stored.
face_templates:
  # "off": no embeddings requested and no template requests. "shadow": templates are matched and a
  # decision with them is counted in cts_face_template_shadow_outcomes_total (log event
  # face_template_shadow_mismatch) without changing live decisions. "enabled": templates are live
  # evidence. Turn on "shadow" only after deploying the template artifact; flip to "enabled" after
  # 7 days when reviewed would_commit_new cases name the wrong person at most 2% of the time.
  mode: "off"
  # Best faces kept per tracked person, by person-id quality score.
  top_k: 8
  # Faces a person needs before a template request; with the 5 s face-id cooldown one camera
  # supplies about three faces in max_age_s.
  min_faces: 3
  # Faces below this person-id quality score never join a template.
  min_face_quality: 0.15
  # Faces leave the buffer this many seconds after capture: as long as
  # world_tracker.ph_close_grace_s, so a person briefly hidden keeps their faces. A PH revived later
  # than that (up to world_tracker.revive_max_age_s) starts with an empty buffer, by design.
  max_age_s: 15.0
  # A face whose cosine to the buffer's mean embedding is below this is rejected as another
  # person's: different people's ArcFace embeddings sit near 0, the same person's well above.
  outlier_min_similarity: 0.25
  # Minimum seconds between two template requests for one person.
  trigger_cooldown_s: 2.0
  # Concurrent template requests, and requests in flight at all (further ones are dropped).
  max_concurrency: 2
  max_in_flight: 16

# Dementia signal computation
#
# Threshold rationale (all values are evidence-based):
#
# stillness_threshold_minutes (60):
#   Clinically meaningful seated immobility in dementia occurs after ~60 min, not 30.
#   Desk work, reading, and TV watching routinely exceed 30 min without clinical concern.
#   Reference: Alzheimer's Association caregiver guidelines; NICE NG97.
#
# stillness_motion_floor (0.05):
#   Unit: mean keypoint displacement in normalized units per second (nu/s) -- absolute
#   pixel displacement / bbox_diagonal_px / dt. Still persons produce ~0.02-0.04 nu/s
#   (breathing + micro-adjustments ~2-3 px/frame at 5 fps, 340 px bbox_diag).
#   Floor is set at the p95 of still segments (0.05 nu/s). Provisional: recalibrate
#   after 1 week of live data using scripts/calibrate_motion_energy.py.
#
# pacing_room_threshold (8):
#   Purpose-driven ambulation (kitchen→living room→bathroom) routinely produces 5-6
#   transitions. True dementia pacing is repetitive and purposeless; 8+ transitions in
#   30 min distinguishes it from normal indoor mobility patterns.
#
# nighttime_transition_threshold (3):
#   One bathroom trip = 2 transitions (bedroom→bathroom→bedroom). Normal nocturnal
#   voiding in seniors occurs 1-2x/night. Evaluation starts at 3+ transitions.
#
# absence_threshold_minutes (90):
#   Cameras do not cover every room. 30 min of no camera coverage is normal (cooking,
#   porch sitting, bathroom). 90 min reduces false alerts from normal off-camera
#   activity while still triggering same-day evaluation.
#
# bathroom_absolute_threshold_seconds (2700 = 45 min):
#   Cold-start fallback before 5+ baseline samples exist. Constipation (common with
#   dementia medications) and slow mobility routinely extend bathroom time beyond 30 min.
signal:
  interval_s: 60
  enabled: true
  window_hours: 24
  stillness_threshold_minutes: 60
  stillness_emergency_minutes: 120
  stillness_motion_floor: 0.05
  # An open dwell qualifies for stillness only if observed within this many
  # seconds of now; otherwise it is a stale/orphaned row, not live immobility.
  stillness_open_freshness_s: 180
  # Floor + per-gap cap for re-deriving observed still time from points on the
  # open branch (mirror TrajectoryWriter's still accumulation).
  stillness_still_energy_floor: 0.005
  stillness_max_gap_s: 60.0
  pacing_room_threshold: 8
  pacing_window_minutes: 30
  nighttime_transition_threshold: 3
  absence_threshold_minutes: 90
  bathroom_absolute_threshold_seconds: 2700
  # Advanced tuning: require this many baseline samples before using a robust z-score
  min_baseline_n: 5
  # Cooldown prevents re-alerting for the same episode; severity escalation still fires.
  cooldown_minutes: 60
  # Trigger must hold for this many consecutive runs before first emission.
  onset_consecutive_windows: 2
  # Room names (substrings) treated as resting rooms for stillness severity.
  resting_rooms: ["bed", "bedroom"]
  # Modified z-score gate for sundowning evening activity.
  sundowning_z_threshold: 2.5
  # Modified z-score gates for bathroom dwell anomaly (day / night paths).
  bathroom_z_threshold: 3.5
  bathroom_z_threshold_night: 4.0
  # Minimum trajectory-point density (points/min) required to evaluate pacing.
  pacing_min_obs_density: 0.5
  # Per-kind override: gait trends should not re-page more than weekly.
  gait_slowing_cooldown_minutes: 10080
  # Minimum evening coverage before evaluating sundowning.
  sundowning_min_evening_minutes: 30
  # Worker scalability controls.
  baseline_cache_ttl_minutes: 60
  max_concurrent_identities: 4
  incremental_enabled: true
  # Severity tiers per kind (see the cts-signals skill severity table).
  # Pacing: absolute transitions per observed minute.
  pacing_warning_rate_per_min: 0.15
  pacing_emergency_rate_per_min: 0.3
  # Sundowning: robust z cut points; cold start emits info only above this rate.
  sundowning_warning_z: 3.0
  sundowning_emergency_z: 4.0
  sundowning_cold_start_min_rate: 0.03
  # Bathroom dwell: robust z cut points after the day/night gate.
  bathroom_warning_z: 4.0
  bathroom_emergency_z: 5.0
  # Nighttime movement: robust z cut points; cold start uses transitions above the gate.
  nighttime_warning_z: 3.0
  nighttime_emergency_z: 4.0
  nighttime_cold_start_warning_extra: 2
  nighttime_cold_start_emergency_extra: 4
  # Absence: minutes past absence_threshold_minutes.
  absence_warning_extra_minutes: 60
  absence_emergency_extra_minutes: 120
  # Demote absence one tier when historically absent at this hour more than this fraction.
  absence_prior_demotion_frac: 0.5
  # Gait slowing: warning above this fractional decline or below this speed (m/s).
  gait_slowing_warning_decline_frac: 0.20
  gait_slowing_warning_speed_m_s: 0.6

# Agitation index signal (Milestone 4)
#
# Defaults to disabled (agitation_enabled: false). Enable per-deployment only
# after caregiver annotation feedback (M4 task 3) provides validation evidence.
# Evidence grade: experimental. Severity capped at warning.
#
# Threshold rationale:
#
# agitation_composite_threshold (0.5):
#   Absolute gate before z-score comparison. Below 0.5 the composite is
#   dominated by missing calibration or low motion; z-score comparison at
#   near-zero values is numerically unstable.
#
# agitation_z_threshold (3.0):
#   Modified z-score gate (robust_z). 3.0 corresponds roughly to p>0.999
#   under a Gaussian; chosen conservatively for an experimental signal.
#
# agitation_warning_composite / agitation_warning_z (0.7 / 4.0):
#   Warning tier requires both high absolute composite (0.7) and a strong
#   z-score (4.0) to reduce false positives from brief periods of elevated
#   activity (exercise, social events).
#
# agitation_cooldown_minutes (120):
#   120 min prevents re-alerting after an episode resolves; onset debounce
#   (min_consecutive=2) already excludes single-window transient bursts.
signal.agitation:
  agitation_enabled: false
  agitation_window_minutes: 30
  agitation_min_observed_minutes: 15
  agitation_composite_threshold: 0.5
  agitation_z_threshold: 3.0
  agitation_warning_composite: 0.7
  agitation_warning_z: 4.0
  agitation_cooldown_minutes: 120
  agitation_weight_in_place: 0.5
  agitation_weight_entropy: 0.3
  agitation_weight_excursion: 0.2

# Fall detection fast path (Milestone 2)
#
# Threshold rationale:
#
# max_descent_rate_hps_threshold (0.8):
#   Heights-per-second descent of the hip proxy. Controlled sitting is 0.2-0.4 hps;
#   falls typically exceed 0.8 hps. Reference: lightweight pose fall detection
#   papers (see VISION.md §3.1 citations).
#
# height_ratio_threshold (0.55):
#   Hip height relative to standing anchor. 1.0 = upright; ~0.3 = floor.
#   0.55 distinguishes floor-level lying from seated postures (~0.6-0.7).
#
# lying_score_threshold (0.4):
#   Minimum posture lying score when keypoints ARE available. When keypoints
#   are absent (person flat on floor) the rule passes regardless, since
#   loss of pose right after a descent spike is itself fall evidence.
#
# floor_speed_max_m_s (2.0):
#   Kalman floor speed above which the detection is likely a projection glitch.
#   Actual falls occur at low-to-moderate floor translation; fast-moving
#   bounding boxes are usually mis-calibrated camera artifacts.
#
# escalation_window_s (60):
#   After emitting warning, check for post-event stillness within this window.
#   One minute gives time for the initial motion to settle and a clear
#   stillness pattern to emerge before escalating to emergency.
#
# cooldown_minutes (10):
#   Repeated descent patterns within 10 min escalate severity rather
#   than re-paging the caregiver.
#
# Defaults to disabled (enabled: false). Enable per-deployment after
# fixture proofs pass, like the CTS robustness flags.
fall_detection:
  enabled: false
  min_samples: 5
  max_descent_rate_hps_threshold: 0.8
  height_ratio_threshold: 0.55
  lying_score_threshold: 0.4
  floor_speed_max_m_s: 2.0
  escalation_window_s: 60.0
  stillness_motion_floor: 0.05
  standing_clear_height_ratio: 0.75
  standing_clear_lying_score: 0.2
  cooldown_minutes: 10
  resting_rooms: ["bed", "bedroom"]

# Pipeline tuning
pipeline:
  # Read by: main.py → FrameProcessingPipeline(max_concurrent_frames=)
  max_concurrent_frames: 4
  # Read by: main.py → PipelineConfig(shutdown_timeout=)
  shutdown_timeout_s: 5.0
  # Read by: main.py → PipelineConfig(live_publish_max_hz=)
  # Maximum publish rate per camera for tracking.events (UI live feed).
  # Inference still runs every frame; this caps only the UI-facing stream.
  live_publish_max_hz: 3.0

  # Single switch for depth client construction and the future TD-008 slow-path.
  posture:
    # Read by: main.py → DepthPostureStrategy / FusedPostureStrategy
    depth_slow_path_enabled: false
    depth_slow_path_min_interval_s: 15.0
    depth_slow_path_max_age_s: 60.0

  # Read by: main.py → PersonDetector(conf_threshold=)
  # 0.6 means YOLO must be ≥60% confident to emit a detection box.
  # Below 0.5 causes excessive false positives; above 0.8 misses partial occlusions.
  detector_confidence: 0.7

  # Read by: main.py → PipelineConfig(allow_skeleton=)
  # True only in unit tests that run without a detector.
  allow_skeleton: false

  # minimum detection confidence for keyframe bbox annotations
  min_keyframe_detection_confidence: 0.5

  # Read by: main.py → PipelineConfig(batch_window_s=, max_batch_size=)
  # batch_window_s=0 disables frame batching (process each frame immediately).
  batch_window_s: 0.5
  max_batch_size: 8
  cross_camera_detector_batching: true

  detection:
    # Read by: main.py → PipelineConfig(detection_iou_dedup_threshold=)
    # Drops near-duplicate YOLO boxes that survived the model's baked NMS.
    iou_dedup_threshold: 0.50

  identity:
    # Read by: main.py → PipelineConfig(identity_rewrite_on_face_commit=)
    rewrite_on_face_commit: true

  # Adaptive ReID cadence (M5.1): skip SOLIDER embeddings in unambiguous
  # single-resident steady-state frames.  Ships shadow-first: the policy
  # evaluates and counts would-skip decisions without actually skipping.
  # Flip enabled: true only after shadow rate >= 60 % on single-resident replay.
  adaptive_reid:
    enabled: false
    shadow: true
    # Seconds between mandatory re-embeddings per PH even in steady state.
    refresh_interval_s: 10.0
    # Coarse proximity gate (metres) for matching a detection to nearby PHs.
    proximity_gate_m: 2.0

# Cognitive Companion — camera config source and API gateway
cognitive_companion:
  url: "${CC_API_URL}"
  api_key: "${CC_INGRESS_API_KEY}"

# CC config sync
cc_sync:
  poll_interval_s: 60.0

# Identity resolver — Bayesian posterior parameters
resolver:
  # Operator tunables: review first when field behavior needs adjustment.
  commit_prob: 0.65
  commit_margin: 0.15
  face_weight_multiplier: 3.0
  prior_maintenance_max_age_s: 30.0
  min_quality_to_commit: 0.35
  enable_quality_gate: true
  flip_debounce_window_s: 10.0
  enable_flip_debounce: true
  # Shadow-first guard for duplicate active resident identities. Enable after
  # replay proves same-person cross-camera continuation still works.
  enable_duplicate_active_identity_guard: true
  # Raw ArcFace cosine similarity a direct face needs to rank a PH in the duplicate guard.
  duplicate_identity_direct_face_min_similarity: 0.90
  # Identity-lock gate for emitted face anchors, as raw ArcFace cosine similarity. This is
  # intentionally stricter than face_id.min_raw_similarity, which only controls whether an anchor
  # is emitted.
  face_commit_min_similarity: 0.70
  arcface_authority_calibrated_confidence: 0.80

  # Advanced / rarely changed constants.
  reid_decision_sim: 0.70
  revision_horizon_s: 600.0
  max_revisions_per_ph_per_minute: 3
  unknown_mass: 0.05
  prior_weight: 0.6
  propagated_face_weight_multiplier: 0.5
  height_weight_multiplier: 1.5
  # Single-view standing height evidence rollout mode: "off", "shadow" (counts mismatches in
  # cts_identity_shadow_mismatch_total{feature="height"} without altering live decisions), or
  # "enabled" (includes HeightChannel in the live posterior).
  height_mode: "shadow"
  commit_prob_dense: 0.80
  commit_margin_dense: 0.20
  identified_entry_boost_min_sim: 0.65
  identified_entry_min_likelihood: 0.80
  # Gallery vote scoring (M01): one scorer applies these to every gallery
  # query path (multiview, single-query fallback, shadow). Numeric defaults
  # unchanged from the pre-M01 hardcoded values, except recency half-life
  # (M03, decision D2: 7.0 -> 2.0 below).
  gallery_verified_trust_multiplier: 2.0
  gallery_auto_verified_trust_multiplier: 1.5
  # Vote trust of an auto_verified row minted from a trajectory-attested wearable association
  # (seed_source wearable_attested). Below face-minted rows (1.5) and operator-verified rows
  # (2.0): the wearable placed the person on the track but never saw the face. An operator can
  # demote or reject these rows in the ReID review queue.
  gallery_wearable_trust_multiplier: 1.25
  # Recency half-life shortened from 7 to 2 days (identity-continuity M03,
  # decision D2): SOLIDER-REID embeddings are clothing-dominated, and
  # clothing validity is a step function at wardrobe change, not a smooth
  # 7-day decay. The hard cutoff below encodes the step; this half-life
  # handles staleness inside the window.
  gallery_recency_half_life_days: 2.0
  # Hard vote-age cutoff in seconds (identity-continuity M03, decision D4):
  # gallery entries older than this contribute zero vote weight on every
  # path (resolver multiview/fallback/shadow queries and the tracker's
  # verified-ReID disagreement probe). null/0/absent disables the cutoff
  # (config-only rollback). Precondition: M02's auto_verified population
  # must be accumulating in production before this default is relied upon,
  # or the resolver loses its ReID vote every morning (V4) -- see the M03
  # milestone doc for the production precondition check.
  gallery_vote_max_age_s: 43200
  # The embedding_coherence_* keys only take effect when
  # enable_embedding_coherence_boost is true.
  enable_embedding_coherence_boost: false
  embedding_coherence_window: 5
  embedding_coherence_min_sim: 0.70
  embedding_coherence_boost: 2.0
  # Sticky maintenance: hold committed identity unless strongly contradicted.
  # Enabled 2026-06-02 after the make ci guardrails (two_people_one_room,
  # resident_plus_stranger) passed green. Staged rollout phase 1.
  enable_sticky_maintenance: true
  # A recognized face for another identity at or above this raw ArcFace cosine similarity
  # contradicts a held identity.
  contradiction_face_similarity: 0.70
  contradiction_posterior_prob: 0.80
  contradiction_posterior_margin: 0.20

  # Rich face evidence — three-valued recognition weights.
  candidate_face_weight_multiplier: 1.0
  face_present_unknown_unknown_mass: 0.10
  frontality_full_yaw_deg: 15.0
  frontality_zero_yaw_deg: 60.0
  frontality_min_factor: 0.3

  # Synthetic face propagation also requires src_face_confidence * gallery_sim
  # to clear face_commit_min_similarity, so 0.72 remains reachable for true
  # handoffs while refusing weak relative/clothing matches.
  cross_gt_face_propagation_threshold: 0.72
  cross_gt_face_propagation_max_gts: 4
  # Multi-view gallery query — per-orientation ReID with max-over-views.
  # Enabled 2026-06-02 (M4) after the UNKNOWN-complement leak fix and guardrails:
  # back-view retrieval commits via max-over-views; orthogonal stranger stays
  # UNKNOWN. Benefit ramps as the gallery accumulates non-front prototypes.
  enable_multiview_gallery: true
  # Fraction of frames where the multiview-gallery shadow comparison runs
  # while enable_multiview_gallery is false (measurement only). 0.0 = disabled;
  # an always-on shadow doubles gallery load for a measurement nobody sampled.
  multiview_shadow_sample_rate: 0.0
  seed_orientation_min_confidence: 0.5

  # Unknown-segment backfill (identity-continuity M04). On a qualifying first
  # calibrated-face commit of a previously Unknown PH, retroactively attribute
  # the PH's Unknown history to that identity: an inferred revision range plus
  # a relabel of identity-NULL person_trajectories/room_dwells rows. Staged
  # rollout: off, then shadow (metrics/logs only, no writes), then enabled.
  # Depends on the same calibration artifact as M02/M03/M09 (see the
  # identity-continuity M00 program doc's 2026-07-19 correction): dormant in
  # production until that artifact is deployed, same as those milestones.
  enable_unknown_backfill: false
  backfill_shadow: true
  # Maximum span (seconds) a backfill may relabel backward from the commit
  # time, regardless of how much earlier the PH's Unknown history extends.
  backfill_max_range_s: 14400.0
  # Wearable-attested backfill: when a wearable association reaches trajectory attestation,
  # relabel the PH's identity-NULL rows over the attested segment (NULL-only, the same clips and
  # cap as above, shadow under backfill_shadow). Room-grade attestation never backfills. Stays
  # false until the owner confirms that attested intervals may be backfilled.
  enable_wearable_backfill: false

  # External identity evidence from cc.identity_assertions (identity-continuity
  # M09): reCamera face sightings and other CC-side identifications, matched
  # to CTS observations at room or floor granularity. Rollout is shadow-first:
  # the matcher and metrics always run once the producer publishes; "shadow"
  # records outcome metrics without injecting anchors into the resolver.
  # Flip to "enabled" only after >= 1 week of live shadow data shows
  # would_name_unknown materially nonzero and an acceptable disagrees rate
  # (see the M09 milestone doc's flip criteria and delete off-ramp).
  cc_assertion_mode: shadow
  # Same recognizer as native ArcFace, but a cross-fleet spatial match is
  # weaker association than a same-frame native anchor. Calibrated by shadow
  # data before flipping cc_assertion_mode to enabled.
  cc_assertion_likelihood_scale: 0.5
  # Confidence haircut for a room-matched (no floor point) assertion, on top
  # of its calibrated confidence.
  room_match_confidence_scale: 0.8
  # Conservative defaults for external-assertion metadata absent from the
  # wire (has_yaw/has_quality unset). Never 1.0 quality or 0.0 yaw -- those
  # would make external evidence look better than native evidence.
  cc_assertion_default_quality: 0.5
  cc_assertion_default_yaw_deg: 60.0
  # Face image quality (the person-id service's score from face size, sharpness, detection score
  # and pitch) weighs recognized face evidence only when this is "enabled". "shadow" keeps live
  # decisions unchanged and counts disagreements in
  # cts_identity_shadow_mismatch_total{feature="face_quality"} (log event
  # face_quality_shadow_mismatch). Flip to "enabled" after 7 days of shadow data only if, on
  # reviewed mismatches, the quality-weighted decision moves a correct commit to Unknown no more
  # often than it removes a wrong commit. "off" ignores face quality entirely.
  face_quality_mode: shadow
  # Face quality assumed for a native face whose service sent no score, outside "off" mode.
  # Conservative (same posture as cc_assertion_default_quality), never 1.0.
  face_quality_missing_default: 0.5
  # Under face_id.evidence_policy "calibrated", the most a recognized face without a calibrated
  # confidence can weigh. Below the 0.80 authority threshold and near an even bet, so it can tip a
  # posterior other evidence already supports but cannot carry one alone.
  uncalibrated_face_max_likelihood: 0.55

# Governed ReID gallery candidate creation (M04). The only pipeline write
# path into reid_gallery: ReIDCandidateStage -> create_review_candidate,
# always pending_review, always with crop/frame provenance. require_calibrated_face
# defaults true: without a deployed calibration artifact this fails closed
# (no automatic candidates) rather than seeding on raw ArcFace similarity.
reid_candidates:
  enabled: true
  require_calibrated_face: true
  calibrated_confidence_min: 0.80
  seed_orientation_min_confidence: 0.5
  min_quality: 0.35
  # Minimum service-measured face image quality of the seeding face, in [0, 1]. 0.0 keeps
  # behavior unchanged; above 0.0 a face without a quality score never seeds (fail closed).
  min_face_quality: 0.0
  max_per_identity_orientation: 10
  # model_version is read separately from triton.reid_model (the live Triton
  # model identifier); this key only covers the crop preprocessing pipeline.
  preprocessing_version: "v1"
  # Identity-continuity M02 (decision D3): a candidate whose calibrated
  # direct-face confidence is at or above this bar mints straight into
  # auto_verified instead of pending_review, so it votes immediately at a
  # reduced trust multiplier. Set above 1.0 to disable auto-verify minting
  # entirely (rollback path) without touching candidate creation itself.
  auto_verify_min_confidence: 0.90
  # Wearable-attested seeding: when no face seed qualifies and the detection's PH carries an
  # attested wearable association, mint a body sample from the wearable. Trajectory grade mints
  # auto_verified (seed_source wearable_attested, vote trust
  # resolver.gallery_wearable_trust_multiplier) only when wearable.mode is "enabled"; room grade
  # mints pending_review and votes only after operator approval (accepted under both "shadow" and
  # "enabled"). Startup refuses true when wearable.mode is "off".
  wearable_seeding_enabled: false
  # Seconds between two wearable seeds of one identity and orientation (seed spacing).
  wearable_min_seed_interval_s: 120.0
  # Cosine above which a wearable seed is skipped as a near-duplicate of a same-day row.
  wearable_max_similarity_to_recent: 0.92
  # Room-grade seeds per identity per UTC day; they all wait for review, so keep the queue small.
  wearable_room_grade_max_per_day: 10

# ReID gallery lifecycle retention: expires aged body-sample rows (nulling their vector,
# deleting their crop object, keeping audit metadata as an expired tombstone).
reid_gallery:
  retention:
    # "off": disabled; "shadow": counts rows past retention without mutating; "enabled": expires.
    mode: "enabled"
    # Days before auto_verified body samples expire (keeps a 14-day appearance window).
    auto_verified_days: 14
    # Days before unreviewed pending_review body samples expire (matches unlabeled face captures).
    pending_review_days: 30
    # Days before operator_verified body samples expire.
    operator_verified_days: 90
    # Seconds between daily retention sweeps.
    interval_s: 86400
    # Maximum rows expired per database batch.
    batch_size: 1000

# Single-view standing height metrology and per-identity profile learning.
height_estimation:
  # Max deviation between homography-recovered camera height and configured mounting_height_m.
  pose_height_tolerance_m: 0.25
  # Max deviation between homography-recovered camera tilt and configured tilt_deg.
  pose_tilt_tolerance_deg: 10.0
  # Head pixel noise propagated into standing height uncertainty.
  sigma_head_px: 4.0
  # Floor uncertainty for hair, footwear, and unmodelled lens distortion.
  sigma_model_m: 0.04
  # Reject boxes touching the top or bottom border within this many pixels.
  top_margin_px: 4
  # Restrict samples to the central horizontal band to limit wide-angle barrel distortion.
  edge_margin_frac: 0.1
  # Maximum upright torso tilt from vertical (degrees) from RTMPose shoulders/hips.
  max_torso_tilt_deg: 25.0
  # Minimum bounding box height/width ratio for standing samples.
  min_aspect_ratio: 1.3
  # Valid physical standing height bounds in metres.
  min_height_m: 0.9
  max_height_m: 2.2
  # Hourly per-identity height profile learner thresholds.
  learner:
    enabled: true
    min_samples: 200
    min_days: 2
    min_cameras: 2
    min_sigma_m: 0.03
    lookback_days: 14
    interval_s: 3600.0

# Keyframe sampler
sampler:
  keyframe_min_interval_s: 30.0
  periodic_expires_hours: 72
  trigger_expires_days: 30

# Person Hypothesis maintenance
person_hypotheses:
  unknown_purge:
    # Deletes only closed PHs with no committed identity. Active unknown PHs stay visible.
    enabled: true
    older_than_days: 7
    interval_s: 3600.0
    batch_size: 1000

# World tracker
world_tracker:
  gate_chi2: 9.21
  alpha_geo: 0.5
  alpha_app: 0.4
  alpha_height: 0.1
  observation_noise_m: 0.25
  process_noise_accel_m_s2: 0.5
  ph_close_grace_s: 15.0
  min_observations_to_publish: 3
  # A recognized face for a different identity at or above this raw ArcFace cosine similarity
  # blocks association with (and revival of) a PH.
  face_conflict_min_similarity: 0.70
  inferred_handoff_max_s: 600
  inferred_handoff_max_distance_m: 5.0
  initial_position_sigma_m: 1.0
  initial_velocity_sigma_m_s: 2.0
  velocity_decay_s: 3.0
  # When true, Kalman prediction integrates exponential velocity decay over dt
  # (dx = v * tau * (1 - exp(-dt / tau))) and propagates covariance through the
  # damped transition matrix. Default false until replay evaluation completes.
  damped_velocity_prediction: false
  # ---- Adaptive zero-velocity update (ZUPT) ----
  # Treat only sustained near-still tracks as stationary. Exit begins at the
  # bottom of the clinically relevant slow-shuffle band (0.2-0.4 m/s) so
  # impaired gait still feeds pacing, wandering, and gait analytics.
  zupt_speed_enter_m_s: 0.12
  zupt_speed_exit_m_s: 0.20
  zupt_consecutive_frames: 5
  zupt_innov_chi2: 2.0
  zupt_velocity_sigma_m_s: 0.05
  height_sigma_m: 0.15
  # ---- Observation uncertainty model (M04 information-form fusion) ----
  # Mirror observation_model.py module constants; tune against M09 acceptance fixtures.
  k_cal: 1.0                        # bias-floor gain: R_cal = (k_cal * residual_m)^2 * I (m^2)
  base_footpoint_sigma_px: 4.0      # detector bbox-bottom localization noise (px, 1 sigma)
  occluded_footpoint_inflation: 8.0  # sigma multiplier when feet are hidden or bbox truncated

  # ---- Stabilized primary camera ----
  # A challenger camera must be best-view for this many consecutive tracker
  # frames before snapshot camera_id/keyframe/room fallback switches.
  primary_switch_frames: 5

  # ---- Cross-camera dedup (U1) ----
  dedup_enabled: true
  dedup_max_distance_m: 0.9
  dedup_residual_coeff_k: 1.0
  dedup_max_distance_ceiling_m: 1.5
  dedup_require_no_face_conflict: true
  # Pairwise distance gate allowance (m/s) per second of capture-time skew between
  # two cameras in the same batch, still capped at dedup_max_distance_ceiling_m.
  # 0.0 disables the skew term; set to ~1.4 m/s to cover normal walking speed.
  dedup_time_skew_speed_m_s: 0.0
  # ---- PH revival ----
  # M2 enabled 2026-06-02 (phase 1) after make ci guardrails passed.
  enable_ph_revival: true
  revive_max_age_s: 30.0
  revive_max_distance_m: 2.0
  revive_appearance_min_sim: 0.55
  # ---- Uncalibrated association relaxation ----
  # M2 enabled 2026-06-02 (phase 1) after make ci guardrails passed.
  enable_uncalibrated_gate_relax: true
  uncalibrated_gate_chi2: 21.0
  uncalibrated_alpha_app: 0.7
  # ---- Multi-view ReID ----
  # Enabled 2026-06-02 (M4): association appearance cost uses max-over-view
  # prototypes; calibrated single-mean path unchanged. Covered by
  # test_cost_matrix_multiview (back-prototype match) and shadow proofs.
  enable_multiview_association: true

  # ---- Cross-camera revival (M5) ----
  # Enabled 2026-06-02 (stage after M2) once step-level guardrails passed:
  # cross_camera_handoff links identity across cameras; the 2-camera stranger
  # guardrail proves a stranger never inherits a resident's identity. Reads
  # per-PH view_prototypes (no gallery dependency); appearance gate is an
  # absolute cosine floor (cross_camera_revive_appearance_min_sim), not the
  # normalize-to-1 posterior. M4 multiview stays OFF (staged next).
  enable_cross_camera_revival: true
  cross_camera_min_plausibility: 0.05
  cross_camera_revive_appearance_min_sim: 0.60

  # ---- Group appearance dedup ----
  # Merges uncalibrated observations from different cameras of one declared
  # overlap group when their appearance similarity reaches
  # dedup_group_appearance_min_sim and no face conflicts. Inert without a group:
  # groups are declared in CC (cts_camera_overlap_groups) and applied on every
  # CC config sync poll. Calibrated observations use the floor-distance pass.
  enable_group_appearance_dedup: true
  dedup_group_appearance_min_sim: 0.75

  # ---- Low-confidence detection recovery (M2.3 BYTE-style second association) ----
  # Default OFF. Enable per-deployment after fixture proofs pass (same rollout
  # pattern as M1-M6). When on, YOLO detections in [low_confidence_floor,
  # pipeline.detector_confidence) are offered in a second association pass
  # against already-open PHs only, with a tightened geometric gate.
  # False-negative risk: defended by stillness pathway (defense in depth).
  # False-positive (ghost) risk: bounded — a stale ghost PH can at most delay
  # PH close by ph_close_grace_s; it cannot spawn a new PH or contaminate
  # identity/gallery state (observation_count and gallery_mean are never updated
  # by the low-band pass, and low-band observations are not persisted).
  enable_low_confidence_recovery: false
  # Minimum YOLO confidence to include in the low band (detections below this
  # are discarded; detections at or above pipeline.detector_confidence remain
  # on the primary high-confidence path unaffected).
  low_confidence_floor: 0.25
  # Chi-squared gate for the second association pass (95% with 2 dof = 5.99,
  # tighter than the primary 9.21 to bound ghost-persistence risk).
  recovery_gate_chi2: 5.99
  # Diagnostic, read-only: when true (and recovery false), the detect stage
  # decodes at low_confidence_floor and records cts_detector_band_frames_total
  # {band=high|low_only|empty} + cts_detector_lowband_boxes_total, to measure
  # whether the detector_confidence cut is hiding present people. Does NOT change
  # tracking (the low band is only counted, never fed to the tracker).
  # TEMPORARILY ENABLED for the detection-gap root-cause measurement (2026-06-17);
  # revert to false once the capture is complete.
  measure_low_confidence_band: false

  # ---- Association covariance/point validation (M03) ----
  # Fail-closed validation of floor points and observation covariance before the
  # Mahalanobis gate. Non-finite points/covariance ALWAYS gate out regardless of
  # this flag (pure safety); this toggles the symmetry/PSD/trace-cap checks.
  # Default true: an invalid covariance must never gate-match. Flip false only
  # for development A/B comparison.
  enable_covariance_validation: true
  # Reject observation covariance whose position-trace exceeds this (m^2). Above
  # any legitimate observation covariance (largest fixture trace is 8.0), below
  # the inflated magnitudes that would otherwise rescue an implausible jump.
  covariance_max_trace_m2: 20.0
  covariance_symmetry_tol_m2: 0.000001
  covariance_psd_tol_m2: -0.000000001

  # ---- Typed authoritative identity evidence (M03 task 5; plumbed M12) ----
  # Verified-ReID disagreement is a configurable strong cost, never a hard gate.
  # M12 wired the per-observation verified-ReID identity input: when this flag
  # is true, WorldTracker resolves each observation's identity from the
  # operator_verified gallery before association and passes it in, so a body
  # whose verified-ReID identity disagrees with a PH's committed identity pays
  # reid_disagreement_cost. Left false pending the release-gated two-person
  # golden-replay acceptance (see identity-integrity-rollout). Flipping it
  # turns on the pre-association gallery lookup, so flip only after acceptance.
  enable_reid_disagreement_cost: false
  reid_disagreement_cost: 0.6
  # Minimum gallery cosine similarity for accepting a top operator_verified hit
  # as an observation's verified-ReID identity. Consulted only when the flag
  # above is true.
  reid_disagreement_min_similarity: 0.5
  # Hard vote-age cutoff for the disagreement probe's gallery lookup
  # (identity-continuity M03, decision D4), mirroring resolver.gallery_vote_max_age_s
  # so the probe sees the same corpus the resolver votes with. Wired now so
  # enabling enable_reid_disagreement_cost later inherits correct temporal
  # behavior; inert while that flag is false. null/0/absent disables the cutoff.
  reid_disagreement_max_age_s: 43200

  # ---- PH-local appearance contamination guard (M03 tasks 7-9) ----
  # One bad association must not immediately pollute a PH's appearance state.
  # An embedding updates gallery_mean / view prototypes / mean_quality only when
  # finite, non-degenerate, quality-qualified, orientation-valid, and either
  # consistent with the matching orientation prototype or initialising a new
  # qualified orientation. Default true: this is a property of the shipped
  # milestone; the flag is a kill-switch that defaults ON for rollback only.
  enable_appearance_outlier_rejection: true
  appearance_min_quality: 0.30
  # L2 norm at/below this is degenerate (zero vector) and rejected; real SOLIDER
  # embeddings are unit length and pass, non-unit vectors are normalised for the
  # cross-person cosine comparison.
  appearance_embedding_norm_tol: 0.000001
  # Cosine floor against the matching orientation prototype; below it an
  # established orientation's embedding is treated as a cross-person outlier.
  appearance_outlier_min_sim: 0.35
  # Minimum orientation confidence to initialise a NEW orientation prototype.
  appearance_new_orientation_min_confidence: 0.30

# Gait and mobility analytics (Milestone 3)
#
# Threshold rationale:
#
# bout_min_speed_m_s (0.3):
#   Captures the slow tail of impaired indoor walking (~0.4-1.0 m/s comfortable)
#   without triggering on postural sway or standing drift.
#
# bout_min_duration_s (3.0):
#   Eliminates incidental steps and balance corrections; 3 s is roughly 2-4
#   strides at 0.5 m/s and is the shortest clinically meaningful gait sample.
#
# bout_close_grace_s (2.0):
#   Bridges brief dips below threshold (momentary slow turns, doorway hesitation)
#   without merging truly separate bouts.  Matches the inter-bout gap used in
#   validated wearable gait algorithms.
#
# max_plausible_speed_m_s (2.5):
#   Above this value the floor projection is almost certainly a calibration
#   glitch (no ambulatory elderly person walks faster than ~2 m/s indoors).
#   Glitch samples are excluded without closing the active bout.
gait:
  enabled: true
  bout_min_speed_m_s: 0.3
  bout_min_duration_s: 3.0
  bout_close_grace_s: 2.0
  max_plausible_speed_m_s: 2.5
  # Aggregator: recompute today + yesterday daily summaries every hour.
  aggregate_interval_s: 3600
  # Aggregator: minimum bouts / walking seconds for the trend detector to treat
  # a day as data-rich.  Sparse days still get a row; the signal gates on this.
  min_daily_bouts: 3
  min_daily_walking_s: 60

# DL-M07: daily appearance profile + same_clothes_suspected evaluator.
# Timezone is shared with `app.timezone` (day-over-day "yesterday's clothes"
# is a local-calendar concept, and CC's day-boundary logic must agree with
# this one, per the Daily Living program's local-day rule).
hygiene:
  same_clothes:
    # Shadow-first (DL10): persist profiles and log/metric the candidate
    # similarity, but never publish, until the backtest supports a flip.
    enabled: false
    # Day-over-day centroid cosine at or above this is "suspiciously similar".
    # Calibrated by the DL-M07 backtest before live use; 0.90 is the
    # pre-backtest default.
    # 2026-07-25 backtest (scripts/backtest_appearance.py --days 21 against the
    # live deployment DB): only 2 identities carry current_identity_id, 4 total
    # qualifying PH rows, no identity has 2 consecutive local days each with
    # min_samples_per_day; no similarity distribution could be computed.
    # Threshold stays at this pre-backtest default; report at
    # daily-living-m07-backtest-report.md. Re-run once identity attribution is
    # denser (see the report's decision section).
    similarity_threshold: 0.90
    # Fewer quality-weighted PH samples than this on either day: no verdict
    # (insufficient evidence, fail-silent per the worker's DataQuality pattern).
    min_samples_per_day: 5
    # Local hour to evaluate: she has dressed for the day, and the caregiver
    # can still act today.
    evaluate_local_hour: 11

# Wearable localization association and identity evidence
wearable:
  # Rollout mode: "off" skips stream consumption and association; "shadow" evaluates
  # associations and counterfactual resolver outcomes without changing live identity;
  # "enabled" feeds accepted wearable evidence into the Bayesian resolver.
  mode: "off"
  window_s: 10.0
  min_fixes: 5
  min_window_llr: 6.0
  min_margin_llr: 4.0
  gate_chi2: 9.21
  gate_penalty_llr: -4.0
  # Timing uncertainty for RF-to-camera clock alignment and burst batching (seconds).
  timing_sigma_s: 0.5
  # Floor-frame systematic bias floor in metres.
  bias_floor_m: 0.15
  # Maximum fix age at ingest (seconds); accommodates micro-batched bursts.
  max_fix_age_s: 15.0
  buffer_max_age_s: 30.0
  max_extrapolation_s: 0.5
  max_fix_buffer_per_tag: 128
  # Major-axis covariance threshold (metres) separating trajectory-class from room-class fixes.
  trajectory_max_sigma_m: 0.75
  room_min_mass: 0.7
  room_polygon_min_mass: 0.05
  room_match_eps: 0.1
  # Stationary tags parked without room change for this duration yield zero evidence.
  parked_after_s: 600.0
  tag_disagreement_window_s: 10.0
  # Graded attestation thresholds for trajectory-class and room-class segments.
  trajectory_attest_min_duration_s: 10.0
  trajectory_attest_min_fixes: 8
  room_attest_min_duration_s: 60.0
  room_entry_window_s: 20.0
  attest_min_llr: 15.0
  # Wearable channel log-likelihood power weight and probability curve parameters.
  weight_multiplier: 2.0
  p_max: 0.97
  p_max_room: 0.90
  llr_mid: 8.0
  llr_scale: 3.0
  # Duplicate-active guard ranking floor and swap-suspected escalation threshold.
  duplicate_guard_min_probability: 0.90
  swap_conflict_count: 3
  swap_conflict_window_s: 600.0
  # Image-only evaluation: wearable truth scores what the cameras alone would decide. For a
  # sampled share of attested PH resolutions the resolver re-decides without the wearable
  # channel twice: control without any wearable-taught gallery row, treatment with them. In
  # both arms no row seen in the last exclusion_s votes (a row cannot vote for the stretch that
  # minted it), so the arms differ only in older wearable-taught rows. Seconds accumulate per
  # arm, outcome, and grade, and persist per identity and UTC day.
  # Each sampled evaluation issues gallery queries, so the rate ships 0.0; the rollout uses 0.1.
  evaluation:
    sample_rate: 0.0
    exclusion_s: 600.0
    # A PH gap longer than this between two sampled evaluations counts no time.
    max_gap_s: 30.0
  supervision:
    # Offer the emitted faces of wearable-attested PHs to person-identification-service, which
    # keeps them as sensor_attested calibration candidates for operator audit and promotion
    # (never enrollment or recognition on their own). person-identification-service must also
    # have calibration_capture.attestation_enabled on, or every offer is a buffer miss.
    face_attestation: "off"
  revocation:
    # Automatically revoke what a tag taught (demote auto_verified rows, revoke attested faces,
    # compensate inferred backfill ranges, and hold further teaching until an operator resumes)
    # when a segment is first marked swap_suspected.
    auto_on_swap: true

# Closed-world prior shaping (who is home, spatially verified joint elimination, guest slot).
# Shapes Bayesian priors only; never commits an identity on its own or refreshes the evidence clock.
closed_world:
  # Rollout mode: "off" skips stream consumption and evaluation; "shadow" evaluates counterfactuals
  # and records shadow outcomes without affecting live decisions; "enabled" joins the live posterior.
  mode: "shadow"
  # Factor applied to an enrolled member reported "away" with high confidence and no fresh
  # non-parked wearable fix. Bounded away from zero so a left-behind phone slows commits rather
  # than blocking them.
  away_factor: 0.3
  # Minimum PresenceService confidence before an "away" status down-weights a member.
  away_min_confidence: 0.8
  # Lookback window (seconds) for a fresh non-parked bound wearable fix that overrides CC "away".
  wearable_home_window_s: 600.0
  # Factor applied to an identity held by another simultaneously observed, spatially distinct open PH.
  occupied_factor: 0.2
  # Maximum capture-time age (seconds) of the other PH's independent evidence to count as fresh.
  occupancy_fresh_s: 60.0
  # Maximum capture-time difference (seconds) between two PHs' last_seen_at to count as simultaneous.
  simultaneous_obs_max_skew_s: 1.0
  # Minimum floor-plane distance (metres) separating calibrated open PHs without a CoPresenceLink.
  min_elimination_distance_m: 2.0
  # Minimum normalized channel share reserved for UNKNOWN (explicit guest slot) normally.
  guest_floor: 0.10
  # Elevated minimum UNKNOWN share when CC reports visitors present (named guest or recent visitor).
  guest_floor_visitors: 0.30
  # Age (seconds) after which household presence statuses are treated as unknown.
  presence_stale_after_s: 180.0
  # Hard lower and upper clamps on per-identity prior-shaping factors.
  factor_floor: 0.05
  factor_ceiling: 1.0

# Multi-day closed-set household appearance classifier (corroborating channel).
# Learns long-lived body cues across days from frozen embeddings labeled only by
# trajectory-attested wearables, direct-face authority, or operator approval.
# Ships dark (mode: off, capture_enabled: false) until the image-only attribution
# necessity gate triggers after wearable rollout.
household_classifier:
  # Rollout mode: "off" skips runtime evaluation; "shadow" evaluates counterfactuals
  # and the image-only classifier arm without changing live decisions; "enabled" joins
  # the live Bayesian posterior as a non-authoritative corroborating channel.
  mode: "off"
  # Opt-in gate for recording labeled body embeddings to appearance_training_samples
  # (60-day retention, deletable per person). Keep false until collection is intended.
  capture_enabled: false
  # Path to the versioned JSON classifier artifact written by scripts/train_household_classifier.py.
  artifact_path: ""
  # Pre-softmax logit scale applied as (weight_multiplier / temperature) with support_multiplier=1.0.
  weight_multiplier: 1.0
  # Minimum UNKNOWN probability mass reserved for open-set safety against visitors.
  unknown_floor: 0.2
  # Calibrated class probability floor required before a class counts as commit evidence.
  commit_evidence_min_probability: 0.8
  # Minimum crop quality [0, 1] required to persist a training sample.
  min_quality: 0.35
  # Per-(PH, orientation) capture-time deduplication interval in seconds.
  dedup_window_s: 10.0
  # Daily cap on open-set negative training samples recorded per local calendar day.
  max_negatives_per_day: 500

# Environment label (dev / staging / production)
env: production

# Logging
logging:
  level: INFO
