[project]
name = "tracking-orchestrator"
version = "0.1.0"
description = "Continuous Tracking System — ML tracking orchestrator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "aiobotocore>=2.15.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
    "structlog>=24.4.0",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0",
    "scipy>=1.14.0",
    "protobuf>=5.29.0",
    "httpx>=0.27",
    "prometheus-client>=0.25.0",
    "triton-shared",
    "shapely>=2.0",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "import-linter>=2.0.0",
    "pre-commit>=4.0.0",
    "importlib-metadata>=8.5.0",
]
triton = [
    "tritonclient[all]>=2.51.0",
]

[project.scripts]
cts-db = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]
migrations = ["*.sql"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["app/proto"]

[tool.ruff.lint]
# U6b: BLE001 (blind-except) guard — no silent fallbacks (rule 15).
# Allowlist: app/trajectory/dementia_signals.py and app/trajectory/depth_posture_strategy.py
# carry per-site # noqa: BLE001 annotations with documented reasons for the metrics
# side-channel passes.  All other broad-excepts in app/ must log + raise or log + dead-letter.
select = ["E", "F", "I", "N", "W", "UP", "B", "BLE", "A", "C4", "SIM", "RUF", "FA"]
ignore = ["B008"]  # Depends() in FastAPI param defaults is idiomatic
per-file-ignores = { "app/main.py" = ["E402"] }  # configure_logging before logger-using imports

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["app/proto/"]

[[tool.mypy.overrides]]
module = ["shapely", "shapely.geometry", "scipy", "scipy.optimize"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.protobuf.*", "cv2", "shapely"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.proto.*"]
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "app.transport.redis_streams",
    "app.storage.postgres.*",
]
ignore_missing_imports = true
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
empty_parameter_set_mark = "fail_at_collect"
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "integration: integration tests requiring testcontainers (skipped by default)",
]

[dependency-groups]
dev = [
    "fakeredis>=2.35.1",
    "hypothesis>=6.100.0",
    "types-pyyaml>=6.0",
    "testcontainers[postgres]>=4.9.0",
]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Layering: core → domain → storage → services → transport → routers"
type = "layers"
layers = [
    "app.core",
    "app.domain",
    "app.storage",
    "app.tracking.world",
    "app.services",
    "app.transport",
    "app.routers",
]

[[tool.importlinter.contracts]]
name = "PH repository imports must go through storage"
type = "forbidden"
source_modules = ["app.routers"]
forbidden_modules = ["app.tracking.world"]

[[tool.importlinter.contracts]]
name = "Legacy BoT-SORT tracking modules are forbidden"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = [
    "app.tracking.tracker",
    "app.tracking.cross_camera",
    "app.tracking.tracklet_manager",
    "app.tracking.association_solver",
    "app.tracking.camera_adjacency",
    "app.tracking.global_track_service",
    "app.tracking.global_track_merger",
    "app.tracking.tracklet_unmerge_service",
    "app.pipeline.stages.local_tracking",
    "app.pipeline.stages.global_tracking",
    "app.storage.postgres.global_track_repo",
    "app.storage.postgres.tracking_repo",
    "app.storage.postgres.do_not_fuse",
]

[[tool.importlinter.contracts]]
name = "Scripts must not be imported from app code"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["scripts"]

# R3: The following storage modules are deprecated and pending removal.
# R3: global_track, tracking, hints modules are deleted. This contract
# prevents them from being re-introduced anywhere in the codebase.
[[tool.importlinter.contracts]]
name = "R3: deleted storage modules must never be re-imported"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = [
    "app.storage.global_track",
    "app.storage.tracking",
    "app.storage.hints",
]

[tool.uv.sources]
triton-shared = { git = "https://github.com/SilverMind-Project/triton-shared" }
