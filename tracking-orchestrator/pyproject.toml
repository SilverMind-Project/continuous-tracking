[project]
name = "tracking-orchestrator"
version = "0.1.0"
description = "Continuous Tracking System — ML tracking orchestrator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "aiobotocore>=2.15.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0",
    "structlog>=24.4.0",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0",
    "scipy>=1.14.0",
    "protobuf>=5.29.0",
    "httpx>=0.27",
    "prometheus-client>=0.25.0",
    "triton-shared",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "import-linter>=2.0.0",
    "pre-commit>=4.0.0",
    "importlib-metadata>=8.5.0",
]
triton = [
    "tritonclient[all]>=2.51.0",
]

[project.scripts]
cts-db = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]
migrations = ["*.sql"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["app/proto"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM", "RUF", "FA"]
ignore = ["B008"]  # Depends() in FastAPI param defaults is idiomatic

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = ["app/proto/"]

[[tool.mypy.overrides]]
module = ["google.protobuf.*", "cv2"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.proto.*"]
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
    "app.tracking.tracker",
    "app.transport.redis_streams",
    "app.storage.postgres.*",
]
ignore_missing_imports = true
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[dependency-groups]
dev = [
    "fakeredis>=2.35.1",
    "types-pyyaml>=6.0",
]

[tool.uv.sources]
triton-shared = { git = "https://github.com/SilverMind-Project/triton-shared" }
