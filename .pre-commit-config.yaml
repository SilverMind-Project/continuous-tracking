repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^tracking-orchestrator/
      - id: ruff-format
        files: ^tracking-orchestrator/

  - repo: https://github.com/golangci/golangci-lint
    rev: v1.63.4
    hooks:
      - id: golangci-lint
        args: [--config, rtsp-ingress/.golangci.yaml]
        files: ^rtsp-ingress/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (project venv)
        entry: tracking-orchestrator/.venv/bin/mypy
        language: system
        files: ^tracking-orchestrator/.*\.py$
        args: ["--config-file", "tracking-orchestrator/pyproject.toml", "tracking-orchestrator/app"]
      - id: venv-guard
        name: assert-no-system-pip
        entry: sh scripts/block-stray-python.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: go-guard
        name: assert-no-raw-go
        entry: sh scripts/block-stray-go.sh
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/bufbuild/buf
    rev: v1.50.0
    hooks:
      - id: buf-format
        files: ^proto/
      - id: buf-lint
        files: ^proto/
