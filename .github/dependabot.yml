version: 2
updates:
  # Tracking orchestrator: Python via uv
  # (tracking-orchestrator/pyproject.toml + tracking-orchestrator/uv.lock)
  - package-ecosystem: "pip"
    directory: "/tracking-orchestrator"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      python-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "python"

  # rtsp-ingress: Go modules (grouped; run `make deps-upgrade` for coordinated bumps)
  - package-ecosystem: "gomod"
    directory: "/rtsp-ingress"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      go-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "go"

  # proto: Go modules (protobuf Go bindings)
  - package-ecosystem: "gomod"
    directory: "/proto"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      proto-go-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "go"
      - "proto"

  # Dockerfiles: base runtimes (python, golang, tritonserver) are pinned in lockstep with
  # .tool-versions, go.mod, ci.yml, and compiled TensorRT engines (verified by
  # `make check-toolchain`). Ignore them here so Dependabot does not open drifting PRs.
  - package-ecosystem: "docker"
    directory: "/tracking-orchestrator"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/rtsp-ingress"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "golang"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/triton-models"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    ignore:
      # Triton upgrades require re-exporting TensorRT .plan engines and matching the
      # cuXXX PyTorch wheel index + docker-compose.yml tag together.
      - dependency-name: "nvcr.io/nvidia/tritonserver"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions (grouped)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
