name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install tracking-orchestrator
        working-directory: tracking-orchestrator
        run: uv sync --frozen --extra dev
      - name: Assert venv-only invocation
        working-directory: tracking-orchestrator
        run: |
          test -x .venv/bin/python
          .venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Ruff check
        working-directory: tracking-orchestrator
        run: .venv/bin/ruff check .
      - name: Ruff format
        working-directory: tracking-orchestrator
        run: .venv/bin/ruff format --check .
      - name: MyPy
        working-directory: tracking-orchestrator
        run: .venv/bin/mypy --config-file pyproject.toml app
      - name: import-linter
        working-directory: tracking-orchestrator
        run: .venv/bin/lint-imports

  python-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: cts
          POSTGRES_PASSWORD: cts
          POSTGRES_DB: continuous_tracking
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install tracking-orchestrator
        working-directory: tracking-orchestrator
        run: uv sync --frozen --extra dev
      - name: Assert venv-only invocation
        working-directory: tracking-orchestrator
        run: |
          test -x .venv/bin/python
          .venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Run migrations
        run: psql -h localhost -U cts -d continuous_tracking -f tracking-orchestrator/migrations/0001_init.sql
        env:
          PGPASSWORD: cts
      - name: Run tests
        working-directory: tracking-orchestrator
        run: .venv/bin/pytest tests -v

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
      - name: Pin GOTOOLCHAIN
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: rtsp-ingress

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
      - name: Pin GOTOOLCHAIN
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: Run Go quality gate
        working-directory: rtsp-ingress
        run: make check

  proto-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.0"
      - name: buf lint
        working-directory: proto
        run: buf lint
      - name: buf generate drift check
        working-directory: proto
        run: |
          buf generate
          git diff --exit-code
      - name: buf breaking
        uses: bufbuild/buf-breaking-action@v1
        with:
          input: proto
          against: "https://github.com/${{ github.repository }}.git#branch=main,subdir=proto"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python: audit tracking-orchestrator dependencies for known CVEs
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install tracking-orchestrator
        working-directory: tracking-orchestrator
        run: uv sync --frozen --extra dev
      - name: pip-audit (Python CVE scan)
        working-directory: tracking-orchestrator
        run: uvx pip-audit --desc

      # Go: audit rtsp-ingress for known vulnerabilities
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
      - name: Pin GOTOOLCHAIN
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: govulncheck (Go CVE scan)
        uses: golang/govulncheck-action@v1
        with:
          work-dir: rtsp-ingress
