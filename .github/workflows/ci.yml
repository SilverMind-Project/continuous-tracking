name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install tracking-orchestrator
        working-directory: tracking-orchestrator
        run: uv sync --frozen --extra dev
      - name: Assert venv-only invocation
        working-directory: tracking-orchestrator
        run: |
          test -x .venv/bin/python
          .venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Ruff check
        working-directory: tracking-orchestrator
        run: .venv/bin/ruff check .
      - name: Ruff format
        working-directory: tracking-orchestrator
        run: .venv/bin/ruff format --check .
      - name: MyPy
        working-directory: tracking-orchestrator
        run: .venv/bin/mypy --config-file pyproject.toml app
      - name: import-linter
        working-directory: tracking-orchestrator
        run: .venv/bin/lint-imports

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install tracking-orchestrator
        working-directory: tracking-orchestrator
        run: uv sync --frozen --extra dev
      - name: Assert venv-only invocation
        working-directory: tracking-orchestrator
        run: |
          test -x .venv/bin/python
          .venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      # Integration-marked tests provision and migrate their own
      # timescale/timescaledb-ha:pg18 testcontainer via the session-scoped
      # `_postgres_container` fixture in tests/conftest.py (Docker is
      # preinstalled on GitHub-hosted runners). The `services: postgres/redis`
      # blocks and manual `psql -f .../0001_init.sql` step formerly here were
      # dead weight: that file doesn't exist (migrations are `.up.sql`/
      # `.down.sql` pairs, 0001-0007), nothing in the test suite ever read
      # from those service containers, and this step failed on every run.
      - name: Run tests
        working-directory: tracking-orchestrator
        run: .venv/bin/pytest tests -v

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
      - name: Pin GOTOOLCHAIN
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: rtsp-ingress

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
      - name: Pin GOTOOLCHAIN
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      # Lint is covered by the separate go-lint job (golangci-lint-action
      # installs the linter). `make check` in rtsp-ingress/Makefile also
      # runs `lint`, which invokes the bare `golangci-lint` binary; this
      # job never installs it, so `make check` here always failed with
      # "golangci-lint: No such file or directory". Run vet/test/build only.
      - name: Run Go vet, tests, and build
        working-directory: rtsp-ingress
        run: make vet test build

  proto-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
      - name: Pin GOTOOLCHAIN
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      # buf generate shells out to protoc-gen-go on PATH; it was never
      # installed here, so the drift check always failed with "could not
      # find protoc plugin for name go" before it ever compared output.
      # Pin to the google.golang.org/protobuf version in rtsp-ingress/go.mod.
      - name: Install protoc-gen-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.0"
      - name: buf lint
        working-directory: proto
        run: buf lint
      - name: buf generate drift check
        working-directory: proto
        run: |
          buf generate
          git diff --exit-code
      - name: buf breaking
        uses: bufbuild/buf-breaking-action@v1
        with:
          input: proto
          against: "https://github.com/${{ github.repository }}.git#branch=main,subdir=proto"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python: audit tracking-orchestrator dependencies for known CVEs
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install tracking-orchestrator
        working-directory: tracking-orchestrator
        run: uv sync --frozen --extra dev
      - name: pip-audit (Python CVE scan)
        working-directory: tracking-orchestrator
        run: uvx pip-audit --desc

      # Go: audit rtsp-ingress for known vulnerabilities
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
      - name: Pin GOTOOLCHAIN
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: govulncheck (Go CVE scan)
        uses: golang/govulncheck-action@v1
        with:
          work-dir: rtsp-ingress
