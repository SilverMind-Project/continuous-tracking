name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install tracking-orchestrator
        working-directory: tracking-orchestrator
        run: uv sync --frozen --extra dev
      - name: Assert venv-only invocation
        working-directory: tracking-orchestrator
        run: |
          test -x .venv/bin/python
          .venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Ruff check
        working-directory: tracking-orchestrator
        run: .venv/bin/ruff check .
      - name: Ruff format
        working-directory: tracking-orchestrator
        run: .venv/bin/ruff format --check .
      - name: MyPy
        working-directory: tracking-orchestrator
        run: .venv/bin/mypy --config-file pyproject.toml app
      - name: import-linter
        working-directory: tracking-orchestrator
        run: .venv/bin/lint-imports
      # The Claude Code hooks committed under .claude/hooks/ (guard, post-edit, stop scan).
      - name: Claude Code hook tests
        run: make hooks-test
      - name: Markdown has no em-dashes
        run: make check-md

  python-test:
    name: Python tests (unit and integration)
    runs-on: ubuntu-latest
    # No service containers: the tests start their own timescaledb-ha:pg18 testcontainer
    # (tests/conftest.py) and apply migrations through MigrationRunner, the production path.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install tracking-orchestrator
        working-directory: tracking-orchestrator
        run: uv sync --frozen --extra dev
      - name: Assert venv-only invocation
        working-directory: tracking-orchestrator
        run: |
          test -x .venv/bin/python
          .venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      # Same targets as the local gate (make ci), so CI and local runs cannot drift apart.
      - name: Unit tests
        run: make test
      - name: Integration tests
        run: make test-integration

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
      - name: Pin GOTOOLCHAIN
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          # Pinned to the same version installed by `make go-tools` (Go 1.24 compatible).
          version: v1.64.8
          working-directory: rtsp-ingress

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
      - name: Pin GOTOOLCHAIN
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: Run Go vet, tests, and build
        working-directory: rtsp-ingress
        run: make vet test build

  proto-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
      - name: Pin GOTOOLCHAIN
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.0"
      - name: buf lint
        working-directory: proto
        run: buf lint
      - name: buf generate drift check
        working-directory: proto
        run: |
          buf generate
          git diff --exit-code
      - name: buf breaking
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
            BASE_REF="FETCH_HEAD"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            BASE_REF="HEAD~1"
          else
            echo "No parent commit to check breaking changes against; skipping."
            exit 0
          fi
          TMP_BASE="$(mktemp -d)"
          trap 'rm -rf "$TMP_BASE"' EXIT
          git archive "$BASE_REF" proto | tar -x -C "$TMP_BASE"
          buf breaking proto --against "$TMP_BASE/proto"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python: audit tracking-orchestrator dependencies for known CVEs
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install tracking-orchestrator
        working-directory: tracking-orchestrator
        run: uv sync --frozen --extra dev
      # `uvx pip-audit` with no arguments audited pip-audit's own throwaway environment and
      # always passed. `make audit` audits the exported uv.lock. Non-blocking until the
      # dependency upgrade follow-up lands (the lock carried open advisories on 2026-10-21);
      # delete continue-on-error once `make audit` is clean.
      - name: pip-audit (locked Python dependencies)
        continue-on-error: true
        run: make audit

      # Go: audit rtsp-ingress for known vulnerabilities
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
      - name: Pin GOTOOLCHAIN
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: govulncheck (Go CVE scan)
        uses: golang/govulncheck-action@v1
        with:
          work-dir: rtsp-ingress
