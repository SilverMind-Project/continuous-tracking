name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install tracking-orchestrator
        working-directory: tracking-orchestrator
        run: uv sync --frozen --extra dev --extra classifier-tools
      - name: Assert venv-only invocation
        working-directory: tracking-orchestrator
        run: |
          test -x .venv/bin/python
          .venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Ruff check
        working-directory: tracking-orchestrator
        run: .venv/bin/ruff check .
      - name: Ruff format
        working-directory: tracking-orchestrator
        run: .venv/bin/ruff format --check .
      - name: MyPy
        working-directory: tracking-orchestrator
        run: .venv/bin/mypy --config-file pyproject.toml app
      - name: import-linter
        working-directory: tracking-orchestrator
        run: .venv/bin/lint-imports
      - name: Install rf-ingress
        working-directory: rf-ingress
        run: uv sync --frozen --extra dev
      - name: Assert rf-ingress venv-only invocation
        working-directory: rf-ingress
        run: |
          test -x .venv/bin/python
          .venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: rf-ingress Ruff check
        working-directory: rf-ingress
        run: .venv/bin/ruff check .
      - name: rf-ingress Ruff format
        working-directory: rf-ingress
        run: .venv/bin/ruff format --check .
      - name: rf-ingress MyPy
        working-directory: rf-ingress
        run: .venv/bin/mypy --config-file pyproject.toml rf_ingress
      - name: rf-ingress import-linter
        working-directory: rf-ingress
        run: .venv/bin/lint-imports
      # The Claude Code hooks committed under .claude/hooks/ (guard, post-edit, stop scan).
      - name: Claude Code hook tests
        run: make hooks-test
      - name: Markdown has no em-dashes
        run: make check-md
      - name: Toolchain pin alignment
        run: make check-toolchain

  python-test:
    name: Python tests (unit and integration)
    runs-on: ubuntu-latest
    # No service containers: the tests start their own timescaledb-ha:pg18 testcontainer
    # (tests/conftest.py) and apply migrations through MigrationRunner, the production path.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install tracking-orchestrator
        working-directory: tracking-orchestrator
        run: uv sync --frozen --extra dev --extra classifier-tools
      - name: Install rf-ingress
        working-directory: rf-ingress
        run: uv sync --frozen --extra dev
      - name: Assert venv-only invocation
        working-directory: tracking-orchestrator
        run: |
          test -x .venv/bin/python
          .venv/bin/python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      # Same targets as the local gate (make ci), so CI and local runs cannot drift apart.
      - name: Unit tests
        run: make test
      - name: rf-ingress unit and conformance tests
        run: make rf-test
      - name: Integration tests
        run: make test-integration

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
      - name: Pin GOTOOLCHAIN
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned to the same version installed by `make go-tools` (Go 1.27 compatible).
          version: v2.15.0
          working-directory: rtsp-ingress

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
      - name: Pin GOTOOLCHAIN
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: Run Go vet, tests, and build
        working-directory: rtsp-ingress
        run: make vet test build

  proto-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
      - name: Pin GOTOOLCHAIN
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.0"
      - name: buf lint
        working-directory: proto
        run: buf lint
      - name: buf generate drift check
        working-directory: proto
        run: |
          buf generate
          git diff --exit-code
      - name: buf breaking
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
            BASE_REF="FETCH_HEAD"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            BASE_REF="HEAD~1"
          else
            echo "No parent commit to check breaking changes against; skipping."
            exit 0
          fi
          TMP_BASE="$(mktemp -d)"
          trap 'rm -rf "$TMP_BASE"' EXIT
          git archive "$BASE_REF" proto | tar -x -C "$TMP_BASE"
          buf breaking proto --against "$TMP_BASE/proto"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Python: audit tracking-orchestrator dependencies for known CVEs
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install tracking-orchestrator
        working-directory: tracking-orchestrator
        run: uv sync --frozen --extra dev --extra classifier-tools
      # `make audit` exports uv.lock and audits every pinned PyPI package.
      - name: pip-audit (locked Python dependencies)
        run: make audit
      - name: pip-audit (rf-ingress locked Python dependencies)
        run: make rf-audit

      # Go: audit rtsp-ingress for known vulnerabilities
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
      - name: Pin GOTOOLCHAIN
        run: echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: govulncheck (Go CVE scan)
        uses: golang/govulncheck-action@v1
        with:
          work-dir: rtsp-ingress

  wear-check:
    name: Wear OS companion (ktlint, detekt, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
      - name: Run wear-companion quality gate
        run: make wear-check
