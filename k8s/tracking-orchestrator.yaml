apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking-orchestrator
  namespace: cts
  labels:
    app.kubernetes.io/name: tracking-orchestrator
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: continuous-tracking
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: tracking-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracking-orchestrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: tracking-orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/khoofia/tracking-orchestrator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: cts-orchestrator-config
                  key: redis.url
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cts-postgres
                  key: dsn
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cts-minio
                  key: access_key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cts-minio
                  key: secret_key
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: cts-orchestrator-config
---
apiVersion: v1
kind: Service
metadata:
  name: tracking-orchestrator
  namespace: cts
  labels:
    app.kubernetes.io/name: tracking-orchestrator
    app.kubernetes.io/part-of: continuous-tracking
spec:
  selector:
    app.kubernetes.io/name: tracking-orchestrator
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tracking-orchestrator
  namespace: cts
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tracking-orchestrator
  namespace: cts
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tracking-orchestrator
  minReplicas: 2
  maxReplicas: 6
  # Scale on Redis Streams consumer lag exposed via prometheus-adapter
  # custom metrics. Operators should pre-create the metric mapping in
  # the cluster's metrics-server config.
  metrics:
    - type: Pods
      pods:
        metric:
          name: cts_frames_ready_consumer_lag
        target:
          type: AverageValue
          averageValue: "200"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tracking-orchestrator
  namespace: cts
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tracking-orchestrator
