apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  namespace: nanai
  labels:
    app.kubernetes.io/name: triton
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: continuous-tracking
spec:
  replicas: 1
  strategy:
    type: Recreate  # GPU model load is slow; rolling deploys hurt latency.
  selector:
    matchLabels:
      app.kubernetes.io/name: triton
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triton
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          effect: NoSchedule
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:24.10-py3
          args:
            - tritonserver
            - --model-repository=/models
            - --grpc-port=8001
            - --http-port=8000
            - --metrics-port=8002
            - --strict-model-config=false
          ports:
            - name: grpc
              containerPort: 8001
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 8002
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: triton-models
---
apiVersion: v1
kind: Service
metadata:
  name: triton
  namespace: nanai
spec:
  selector:
    app.kubernetes.io/name: triton
  ports:
    - name: grpc
      port: 8001
      targetPort: grpc
    - name: http
      port: 8000
      targetPort: http
    - name: metrics
      port: 8002
      targetPort: metrics
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: triton-models
  namespace: nanai
spec:
  accessModes: ["ReadOnlyMany"]
  resources:
    requests:
      storage: 50Gi
