apiVersion: v1
kind: ConfigMap
metadata:
  name: cts-orchestrator-config
  namespace: nanai
  labels:
    app.kubernetes.io/name: tracking-orchestrator
    app.kubernetes.io/part-of: continuous-tracking
data:
  # Runtime configuration consumed by the FastAPI app factory. All
  # values are overridable by environment variables. The wire-format
  # toggles (proto_encode / legacy_json_fields) implement the M10
  # rollout strategy: dual-write during the migration window, flip
  # legacy_json_fields=false once every consumer is on proto.
  orchestrator.yaml: |
    transport:
      events_stream: tracking.events
      revisions_stream: tracking.revisions
      signals_stream: tracking.signals
      scene_samples_stream: scene.samples
    triton:
      url: triton.nanai.svc.cluster.local:8001
      ensemble_model: perception_ensemble
      batch_size: 8
    redis:
      url: redis://redis.nanai.svc.cluster.local:6379/0
      stream_maxlen: 100000
    minio:
      endpoint: minio.nanai.svc.cluster.local:9000
      bucket: cts-frames
    observability:
      metrics_port: 9090
      log_level: info
      log_format: json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cts-ingress-config
  namespace: nanai
  labels:
    app.kubernetes.io/name: rtsp-ingress
    app.kubernetes.io/part-of: continuous-tracking
data:
  ingress.yaml: |
    server:
      health_addr: :8090
      shutdown_grace_s: 15
    go2rtc:
      addr: http://localhost:1984
      timeout_s: 10
    minio:
      endpoint: minio.nanai.svc.cluster.local:9000
      bucket: cts-frames
    redis:
      addr: redis.nanai.svc.cluster.local:6379
      stream: frames.ready
      maxlen_approx: 100000
    cognitive_companion:
      base_url: http://cognitive-companion.cc.svc.cluster.local:8000
      reconcile_interval_s: 60
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cts-go2rtc-config
  namespace: nanai
  labels:
    app.kubernetes.io/name: rtsp-ingress
    app.kubernetes.io/part-of: continuous-tracking
data:
  go2rtc.yaml: |
    api:
      listen: ":1984"
    log:
      level: warn
