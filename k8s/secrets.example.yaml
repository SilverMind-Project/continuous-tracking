# Example secret manifests. DO NOT commit real values to git.
# Operators should drive these via sealed-secrets or external-secrets.

apiVersion: v1
kind: Secret
metadata:
  name: cts-postgres
  namespace: nanai
type: Opaque
stringData:
  user: cts
  password: REPLACE_ME
  dsn: postgresql://cts:REPLACE_ME@postgres.nanai.svc.cluster.local:5432/continuous_tracking
---
apiVersion: v1
kind: Secret
metadata:
  name: cts-minio
  namespace: nanai
type: Opaque
stringData:
  access_key: REPLACE_ME
  secret_key: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: cc-service-tokens
  namespace: nanai
type: Opaque
stringData:
  api_key: REPLACE_ME  # used by rtsp-ingress to sync camera config from CC
